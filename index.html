ber = number / 2`，最後全部 Pop 印出，解決餘數由低位到高位產生導致順序顛倒的問題。\n\n### 2. 語法解析（Parsing Data）\n- **括號配對檢查（`parseParens`，Alg 4-11）**：讀入字元，遇到左括號 `(` 就 Push；遇到右括號 `)` 時若堆疊為空代表「右括號多餘（Closing parenthesis not matched）」，否則 Pop 配對；全部讀完後若堆疊非空代表「左括號未閉合（Opening parenthesis not matched）」。\n\n### 3. 延遲資料使用（Postponing Data Usage）\n- **中序轉後序（`inToPostFix`，Alg 4-12）**：運算式分為前序（Prefix：`+ a b`）、中序（Infix：`a + b`）與後序（Postfix：`a b +`）。後序與前序皆**不需括號**且只有唯一求值規則。\n  - 運算子優先權：Priority 2（`*`, `/`）> Priority 1（`+`, `-`）> Priority 0（`(`）。\n  - 演算法規則：遇運算元直接輸出；遇 `(` 推入；遇 `)` 彈出輸出直到 `(`；遇運算子時若 `priority(token) <= priority(topToken)` 則持續彈出輸出，再將 `token` 推入；輸入結束後清空堆疊。\n  - 追蹤範例（Table 4-1）：`A * B - ( C + D ) + E` → `A B * C D + - E +`。\n- **後序式求值（`postFixEvaluate`，Alg 4-13）**：將**運算元數值**推入堆疊；遇到運算子時依序彈出 `operand2` 與 `operand1`，計算 `operand1 operator operand2` 後推回堆疊（如 `2 4 6 + *` → `2 * (4 + 6) = 20`）。\n\n### 4. 回溯法（Backtracking Steps）\n- **目標搜尋（`seekGoal`，Alg 4-14）**：走訪圖形時將經過節點與所有分支點（Branch Points）推入堆疊，當遇到死路時即可 Pop 退回上一個決策點繼續嘗試。\n- **八皇后問題（`queens8`，Alg 4-15）**：逐列（Row）嘗試放置皇后並將座標 `[row, col]` 推入堆疊；若該列所有欄位皆受威脅（`col >= boardSize`），則從堆疊 Pop 出上一列皇后的位置，嘗試其下一欄（如 Figure 4-17 之 $4 \\times 4$ 棋盤逐步解）。"}, {"index": 5, "kind": "content", "title": "四、常見考點／應用場景與限制", "markdown": "## 四、常見考點／應用場景與限制\n\n- **手算中序轉後序技巧**：先依優先權補齊所有括號 → 將每個運算子移至其對應右括號的右側 → 移除所有括號。\n- **後序求值彈出順序**：第一個彈出的是右運算元 `operand2`，第二個彈出的是左運算元 `operand1`，對於減法 `-` 與除法 `/` 順序至關重要。\n- **溢位／下溢防呆**：動態鏈結串列實作仍需透過 `fullStack` 檢查動態記憶體是否耗盡；陣列實作則需對照 `stackMax` 判斷 Overflow。"}, {"index": 6, "kind": "content", "title": "五、關聯頁面", "markdown": "## 五、關聯頁面\n- **同軌來源出處**：[資料結構 Ch.4 Stacks 課程簡報摘要](#deck/sources/ppt/DS_Ch4-Stacks)\n- **同軌相關概念**：[線性串列與單向鏈結串列演算法](#deck/concepts/ppt/Linear-and-Singly-Linked-Lists)、[進階鏈結串列結構（環狀、雙向、多重鏈結）](#deck/concepts/ppt/Complex-Linked-Lists)"}], "sourceRefs": [{"slug": "sources/ppt/DS_Ch4-Stacks", "label": "資料結構 Ch.4 Stacks 課程簡報摘要"}], "backlinks": [{"slug": "concepts/ppt/Complex-Linked-Lists", "label": "進階鏈結串列結構（環狀、雙向、多重鏈結）"}, {"slug": "concepts/ppt/Linear-and-Singly-Linked-Lists", "label": "線性串列與單向鏈結串列演算法"}, {"slug": "overview", "label": "課程簡報與原文書知識庫全域總覽"}, {"slug": "sources/ppt/DS_Ch4-Stacks", "label": "資料結構 Ch.4 Stacks 課程簡報摘要"}]}, {"slug": "overview", "frontmatter": {"title": "課程簡報與原文書知識庫全域總覽", "type": "overview", "source_type": "mixed", "tags": ["course-notes", "textbooks", "operating-systems", "data-structures", "overview"], "created": "2026-11-16", "updated": "2026-11-16", "sources": ["[[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5]]", "[[sources/ppt/DS_Ch3-Linked-Lists]]", "[[sources/ppt/DS_Ch4-Stacks]]"], "status": "growing", "authors": "", "raw_file": ""}, "content": "# 課程簡報與原文書知識庫全域總覽\n\n> 本頁面是整個知識庫的最高層綜述（Synthesis），彙整來自 `raw/ppt/`（課程簡報）與 `raw/book/`（原文書）所累積的雙軌概念與知識網絡。\n\n## 一、目前收錄主題與知識主軸\n\n### 1. 資料結構（Data Structures — 課程簡報軌道 `ppt/`）\n透過 [資料結構 Ch.3 Linked Lists](#deck/sources/ppt/DS_Ch3-Linked-Lists) 與 [資料結構 Ch.4 Stacks](#deck/sources/ppt/DS_Ch4-Stacks) 建立的線性結構與演算法脈絡：\n- **線性串列與單向鏈結串列**：[線性串列與單向鏈結串列演算法](#deck/concepts/ppt/Linear-and-Singly-Linked-Lists)（General vs. Restricted 分類、陣列與鏈結串列權衡、插入／刪除兩大簡化情境、`searchList` 雙指標回傳、走訪／銷毀、串接與 Array of Lists）。\n- **進階鏈結串列結構**：[進階鏈結串列結構（環狀、雙向、多重鏈結）](#deck/concepts/ppt/Complex-Linked-Lists)（環狀鏈結串列防無窮迴圈機制、雙向鏈結串列 `insertDbl`/`deleteDbl` 與課堂勘誤、多重鏈結串列多鍵值共享節點）。\n- **堆疊（Stack）與四大應用**：[堆疊（Stack）資料結構、ADT 實作與四大應用](#deck/concepts/ppt/Stacks-and-Applications)（LIFO 特性與 Overflow/Underflow、Linked List vs. Array ADT 實作、資料反轉、括號解析、中序轉後序與求值、目標搜尋與八皇后回溯法）。\n\n### 2. 作業系統（Operating Systems — 原文書軌道 `book/`）\n透過 [Operating System Concepts (10th Ed.) Ch.1–5](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5) 建立的核心系統知識脈絡：\n- **架構、特權保護與核心追蹤**：[作業系統架構、系統呼叫與核心除錯](#deck/concepts/book/OS-Architecture-and-System-Calls)（中斷、DMA、儲存階層、Dual-Mode 保護、混合式核心、BCC/eBPF 追蹤）。\n- **行程隔離與通訊**：[行程管理與行程間通訊（IPC）](#deck/concepts/book/Processes-and-IPC)（`fork`/`exec`、Shared Memory vs. Message Passing、Sockets/RPC）。\n- **執行緒與平行化**：[執行緒、平行運算與隱式多工](#deck/concepts/book/Threads-and-Concurrency)（Amdahl's Law、1-to-1 模型、Thread Pools/Fork-Join/GCD/TBB、Linux `clone()` 與容器基礎）。\n- **CPU 與多核／NUMA 排程**：[CPU 排程演算法與多核／即時排程](#deck/concepts/book/CPU-Scheduling)（搶占式排程、MLFQ、Processor Affinity、NUMA Scheduling Domains、Linux CFS 與即時排程）。\n\n## 二、跨來源知識整合脈絡\n\n- **抽象化與資料隱藏（Data Hiding）**：無論是作業系統以 System Call API 隔離硬體細節，或是資料結構將 `emptyList`、`stackCount`、`fullStack` 封裝為 ADT 介面，核心目的皆是讓呼叫端不依賴底層記憶體配置（陣列索引或指標），保留未來替換實作的彈性。\n- **時間、空間與局部性（Locality）的工程權衡**：陣列具備實體連續記憶體與隨機存取／二元搜尋優勢，但插入刪除需搬移資料（這也是 OS Process/Stack 配置與 Data Structure 選擇陣列或鏈結串列的共同考量）；鏈結串列與雙向／多重鏈結則以額外指標空間換取 $O(1)$ 指標重接與多維走訪彈性。\n\n## 三、待補充與後續整合方向\n\n- `ppt/` 軌道目前已收錄 Ch.3（Linked Lists）與 Ch.4（Stacks），待後續補充 Ch.1–2（演算法分析、遞迴）與 Ch.5（Queues）等簡報。\n- `book/` 軌道目前涵蓋《Operating System Concepts》第 1–5 章，尚未涵蓋同步與死結（Ch.6–8）、記憶體管理與虛擬記憶體（Ch.9–10）等章節。", "rawContent": "# 課程簡報與原文書知識庫全域總覽\n\n> 本頁面是整個知識庫的最高層綜述（Synthesis），彙整來自 `raw/ppt/`（課程簡報）與 `raw/book/`（原文書）所累積的雙軌概念與知識網絡。\n\n## 一、目前收錄主題與知識主軸\n\n### 1. 資料結構（Data Structures — 課程簡報軌道 `ppt/`）\n透過 [[sources/ppt/DS_Ch3-Linked-Lists|資料結構 Ch.3 Linked Lists]] 與 [[sources/ppt/DS_Ch4-Stacks|資料結構 Ch.4 Stacks]] 建立的線性結構與演算法脈絡：\n- **線性串列與單向鏈結串列**：[[concepts/ppt/Linear-and-Singly-Linked-Lists]]（General vs. Restricted 分類、陣列與鏈結串列權衡、插入／刪除兩大簡化情境、`searchList` 雙指標回傳、走訪／銷毀、串接與 Array of Lists）。\n- **進階鏈結串列結構**：[[concepts/ppt/Complex-Linked-Lists]]（環狀鏈結串列防無窮迴圈機制、雙向鏈結串列 `insertDbl`/`deleteDbl` 與課堂勘誤、多重鏈結串列多鍵值共享節點）。\n- **堆疊（Stack）與四大應用**：[[concepts/ppt/Stacks-and-Applications]]（LIFO 特性與 Overflow/Underflow、Linked List vs. Array ADT 實作、資料反轉、括號解析、中序轉後序與求值、目標搜尋與八皇后回溯法）。\n\n### 2. 作業系統（Operating Systems — 原文書軌道 `book/`）\n透過 [[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5|Operating System Concepts (10th Ed.) Ch.1–5]] 建立的核心系統知識脈絡：\n- **架構、特權保護與核心追蹤**：[[concepts/book/OS-Architecture-and-System-Calls]]（中斷、DMA、儲存階層、Dual-Mode 保護、混合式核心、BCC/eBPF 追蹤）。\n- **行程隔離與通訊**：[[concepts/book/Processes-and-IPC]]（`fork`/`exec`、Shared Memory vs. Message Passing、Sockets/RPC）。\n- **執行緒與平行化**：[[concepts/book/Threads-and-Concurrency]]（Amdahl's Law、1-to-1 模型、Thread Pools/Fork-Join/GCD/TBB、Linux `clone()` 與容器基礎）。\n- **CPU 與多核／NUMA 排程**：[[concepts/book/CPU-Scheduling]]（搶占式排程、MLFQ、Processor Affinity、NUMA Scheduling Domains、Linux CFS 與即時排程）。\n\n## 二、跨來源知識整合脈絡\n\n- **抽象化與資料隱藏（Data Hiding）**：無論是作業系統以 System Call API 隔離硬體細節，或是資料結構將 `emptyList`、`stackCount`、`fullStack` 封裝為 ADT 介面，核心目的皆是讓呼叫端不依賴底層記憶體配置（陣列索引或指標），保留未來替換實作的彈性。\n- **時間、空間與局部性（Locality）的工程權衡**：陣列具備實體連續記憶體與隨機存取／二元搜尋優勢，但插入刪除需搬移資料（這也是 OS Process/Stack 配置與 Data Structure 選擇陣列或鏈結串列的共同考量）；鏈結串列與雙向／多重鏈結則以額外指標空間換取 $O(1)$ 指標重接與多維走訪彈性。\n\n## 三、待補充與後續整合方向\n\n- `ppt/` 軌道目前已收錄 Ch.3（Linked Lists）與 Ch.4（Stacks），待後續補充 Ch.1–2（演算法分析、遞迴）與 Ch.5（Queues）等簡報。\n- `book/` 軌道目前涵蓋《Operating System Concepts》第 1–5 章，尚未涵蓋同步與死結（Ch.6–8）、記憶體管理與虛擬記憶體（Ch.9–10）等章節。", "slides": [{"index": 0, "kind": "cover", "title": "課程簡報與原文書知識庫全域總覽", "markdown": ""}, {"index": 1, "kind": "content", "title": "投影片 2", "markdown": "> 本頁面是整個知識庫的最高層綜述（Synthesis），彙整來自 `raw/ppt/`（課程簡報）與 `raw/book/`（原文書）所累積的雙軌概念與知識網絡。"}, {"index": 2, "kind": "content", "title": "一、目前收錄主題與知識主軸", "markdown": "## 一、目前收錄主題與知識主軸\n\n### 1. 資料結構（Data Structures — 課程簡報軌道 `ppt/`）\n透過 [資料結構 Ch.3 Linked Lists](#deck/sources/ppt/DS_Ch3-Linked-Lists) 與 [資料結構 Ch.4 Stacks](#deck/sources/ppt/DS_Ch4-Stacks) 建立的線性結構與演算法脈絡：\n- **線性串列與單向鏈結串列**：[線性串列與單向鏈結串列演算法](#deck/concepts/ppt/Linear-and-Singly-Linked-Lists)（General vs. Restricted 分類、陣列與鏈結串列權衡、插入／刪除兩大簡化情境、`searchList` 雙指標回傳、走訪／銷毀、串接與 Array of Lists）。\n- **進階鏈結串列結構**：[進階鏈結串列結構（環狀、雙向、多重鏈結）](#deck/concepts/ppt/Complex-Linked-Lists)（環狀鏈結串列防無窮迴圈機制、雙向鏈結串列 `insertDbl`/`deleteDbl` 與課堂勘誤、多重鏈結串列多鍵值共享節點）。\n- **堆疊（Stack）與四大應用**：[堆疊（Stack）資料結構、ADT 實作與四大應用](#deck/concepts/ppt/Stacks-and-Applications)（LIFO 特性與 Overflow/Underflow、Linked List vs. Array ADT 實作、資料反轉、括號解析、中序轉後序與求值、目標搜尋與八皇后回溯法）。\n\n### 2. 作業系統（Operating Systems — 原文書軌道 `book/`）\n透過 [Operating System Concepts (10th Ed.) Ch.1–5](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5) 建立的核心系統知識脈絡：\n- **架構、特權保護與核心追蹤**：[作業系統架構、系統呼叫與核心除錯](#deck/concepts/book/OS-Architecture-and-System-Calls nt": "# Operating System Concepts (10th Ed.) Ch.1–5 來源筆記\n\n- **來源軌道**：`Book（原文書）`\n- **原始檔案**：`raw/book/Ch1-5 Abraham-Silberschatz-Operating-System-Concepts-10th-2018 (1).pdf`（文字整理：`raw/book/2018-Silberschatz-OS-Concepts-10th-Ch1-5.md`）\n- **作者／出版**：Abraham Silberschatz, Peter Baer Galvin, Greg Gagne（Wiley, 10th Edition, 2018）\n\n## 一、一句話核心結論\n\n本教材第 1 至第 5 章完整建立了現代作業系統的核心抽象與實作脈絡：從硬體中斷與儲存階層出發，透過系統呼叫與混合式核心架構管理資源，並以行程（Process）、執行緒（Thread）與搶占式多核 CPU 排程最大化系統吞吐量與回應速度。\n\n## 二、章節涵蓋範圍與核心問題\n\n1. **Chapter 1（Introduction）**：作業系統作為「資源分配者」與「控制程式」的角色；硬體中斷、DMA 與多層級儲存架構；雙重模式（User/Kernel Mode）保護與虛擬化／分散式環境基礎。\n2. **Chapter 2（Operating-System Structures）**：OS 服務介面（CLI/GUI/System Calls/API/ABI）、程式編譯連結與載入（ELF/PE/Mach-O）、核心架構演進（Monolithic、Microkernel、LKM、Hybrid），以及核心除錯與 BCC/eBPF 追蹤。\n3. **Chapter 3（Processes）**：行程記憶體配置、狀態轉換與 PCB（Linux `task_struct`）、`fork()`/`exec()` 生命週期，以及行程間通訊（Shared Memory、Message Passing、Pipes、Sockets、RPC/Android Binder）。\n4. **Chapter 4（Threads & Concurrency）**：執行緒與平行運算挑戰（Amdahl's Law）、多執行緒對應模型、顯式執行緒函式庫（Pthreads/Windows/Java）與隱式執行緒（Thread Pools、Fork-Join、OpenMP、GCD、TBB），以及 Linux `clone()` 統一任務模型。\n5. **Chapter 5（CPU Scheduling）**：CPU–I/O Burst 循環、經典與多層級回饋排程演算法、多核／SMT／NUMA／異質多核（`big.LITTLE`）排程、即時系統排程（RM 與 EDF），以及 Linux CFS、Windows 與 Solaris 實作案例。\n\n## 三、關鍵方法與實作細節整理\n\n- **雙層保護與系統呼叫路徑**：應用程式透過 API（如 `libc` / Windows API）呼叫 System-Call Interface，觸發軟體中斷（Trap）將硬體 `mode bit` 從 User (`1`) 切換為 Kernel (`0`)，於核心執行特權指令後返回（詳見 [作業系統架構、系統呼叫與核心除錯](#deck/concepts/book/OS-Architecture-and-System-Calls)）。\n- **混合式核心成為主流**：純 Microkernel 雖具備模組化與高容錯性，但受限於 User Space 訊息複製開銷；因此現代系統（Linux LKM、macOS Darwin、Windows NT/10）皆採取混合架構，將關鍵服務整合於單一位址空間並保留動態模組擴充能力（詳見 [作業系統架構、系統呼叫與核心除錯](#deck/concepts/book/OS-Architecture-and-System-Calls)）。\n- **IPC 權衡**：Shared Memory 在建立後不需核心介入、傳輸速度最快，但需應用程式自行處理同步；Message Passing 適合少量資料與跨機分散式系統（詳見 [行程管理與行程間通訊（IPC）](#deck/concepts/book/Processes-and-IPC)）。\n- **隱式平行化趨勢**：面對數百至數千執行緒的現代多核環境，開發者傾向只定義「任務（Tasks）」，將執行緒池大小、Work Stealing 負載平衡與快取親和性交由 `ForkJoinPool`、OpenMP、GCD 或 TBB 處理（詳見 [執行緒、平行運算與隱式多工](#deck/concepts/book/Threads-and-Concurrency)）。\n- **真實排程器對資源局部性的妥協**：Linux CFS 透過 `vruntime` 與紅黑樹維持公平性與 I/O 回應，同時藉由分層的 NUMA Scheduling Domains 限制跨節點遷移，平衡「負載均衡」與「快取／記憶體親和性（Processor Affinity）」（詳見 [CPU 排程演算法與多核／即時排程](#deck/concepts/book/CPU-Scheduling)）。\n\n## 四、限制與教材範圍說明\n\n- 本檔案僅包含第 1 至第 5 章（Overview 與 Process Management），尚未涵蓋第 6–8 章的同步與死結（Synchronization & Deadlocks）、第 9–10 章的虛擬記憶體（Virtual Memory），以及第 18 章的容器與虛擬機深入實作。\n- 教材出版於 2018 年（如 Linux 4.x 核心、Windows 10、JDK 1.8），部分新世代排程器改進（如 Linux 6.6 引入的 EEVDF 取代 CFS）需於後續補充最新資料對照。\n\n## 五、與知識庫的關聯\n- **同軌核心概念頁（Book）**：\n  - [作業系統架構、系統呼叫與核心除錯](#deck/concepts/book/OS-Architecture-and-System-Calls)\n  - [行程管理與行程間通訊（IPC）](#deck/concepts/book/Processes-and-IPC)\n  - [執行緒、平行運算與隱式多工](#deck/concepts/book/Threads-and-Concurrency)\n  - [CPU 排程演算法與多核／即時排程](#deck/concepts/book/CPU-Scheduling)", "rawContent": "# Operating System Concepts (10th Ed.) Ch.1–5 來源筆記\n\n- **來源軌道**：`Book（原文書）`\n- **原始檔案**：`raw/book/Ch1-5 Abraham-Silberschatz-Operating-System-Concepts-10th-2018 (1).pdf`（文字整理：`raw/book/2018-Silberschatz-OS-Concepts-10th-Ch1-5.md`）\n- **作者／出版**：Abraham Silberschatz, Peter Baer Galvin, Greg Gagne（Wiley, 10th Edition, 2018）\n\n## 一、一句話核心結論\n\n本教材第 1 至第 5 章完整建立了現代作業系統的核心抽象與實作脈絡：從硬體中斷與儲存階層出發，透過系統呼叫與混合式核心架構管理資源，並以行程（Process）、執行緒（Thread）與搶占式多核 CPU 排程最大化系統吞吐量與回應速度。\n\n## 二、章節涵蓋範圍與核心問題\n\n1. **Chapter 1（Introduction）**：作業系統作為「資源分配者」與「控制程式」的角色；硬體中斷、DMA 與多層級儲存架構；雙重模式（User/Kernel Mode）保護與虛擬化／分散式環境基礎。\n2. **Chapter 2（Operating-System Structures）**：OS 服務介面（CLI/GUI/System Calls/API/ABI）、程式編譯連結與載入（ELF/PE/Mach-O）、核心架構演進（Monolithic、Microkernel、LKM、Hybrid），以及核心除錯與 BCC/eBPF 追蹤。\n3. **Chapter 3（Processes）**：行程記憶體配置、狀態轉換與 PCB（Linux `task_struct`）、`fork()`/`exec()` 生命週期，以及行程間通訊（Shared Memory、Message Passing、Pipes、Sockets、RPC/Android Binder）。\n4. **Chapter 4（Threads & Concurrency）**：執行緒與平行運算挑戰（Amdahl's Law）、多執行緒對應模型、顯式執行緒函式庫（Pthreads/Windows/Java）與隱式執行緒（Thread Pools、Fork-Join、OpenMP、GCD、TBB），以及 Linux `clone()` 統一任務模型。\n5. **Chapter 5（CPU Scheduling）**：CPU–I/O Burst 循環、經典與多層級回饋排程演算法、多核／SMT／NUMA／異質多核（`big.LITTLE`）排程、即時系統排程（RM 與 EDF），以及 Linux CFS、Windows 與 Solaris 實作案例。\n\n## 三、關鍵方法與實作細節整理\n\n- **雙層保護與系統呼叫路徑**：應用程式透過 API（如 `libc` / Windows API）呼叫 System-Call Interface，觸發軟體中斷（Trap）將硬體 `mode bit` 從 User (`1`) 切換為 Kernel (`0`)，於核心執行特權指令後返回（詳見 [[concepts/book/OS-Architecture-and-System-Calls]]）。\n- **混合式核心成為主流**：純 Microkernel 雖具備模組化與高容錯性，但受限於 User Space 訊息複製開銷；因此現代系統（Linux LKM、macOS Darwin、Windows NT/10）皆採取混合架構，將關鍵服務整合於單一位址空間並保留動態模組擴充能力（詳見 [[concepts/book/OS-Architecture-and-System-Calls]]）。\n- **IPC 權衡**：Shared Memory 在建立後不需核心介入、傳輸速度最快，但需應用程式自行處理同步；Message Passing 適合少量資料與跨機分散式系統（詳見 [[concepts/book/Processes-and-IPC]]）。\n- **隱式平行化趨勢**：面對數百至數千執行緒的現代多核環境，開發者傾向只定義「任務（Tasks）」，將執行緒池大小、Work Stealing 負載平衡與快取親和性交由 `ForkJoinPool`、OpenMP、GCD 或 TBB 處理（詳見 [[concepts/book/Threads-and-Concurrency]]）。\n- **真實排程器對資源局部性的妥協**：Linux CFS 透過 `vruntime` 與紅黑樹維持公平性與 I/O 回應，同時藉由分層的 NUMA Scheduling Domains 限制跨節點遷移，平衡「負載均衡」與「快取／記憶體親和性（Processor Affinity）」（詳見 [[concepts/book/CPU-Scheduling]]）。\n\n## 四、限制與教材範圍說明\n\n- 本檔案僅包含第 1 至第 5 章（Overview 與 Process Management），尚未涵蓋第 6–8 章的同步與死結（Synchronization & Deadlocks）、第 9–10 章的虛擬記憶體（Virtual Memory），以及第 18 章的容器與虛擬機深入實作。\n- 教材出版於 2018 年（如 Linux 4.x 核心、Windows 10、JDK 1.8），部分新世代排程器改進（如 Linux 6.6 引入的 EEVDF 取代 CFS）需於後續補充最新資料對照。\n\n## 五、與知識庫的關聯\n- **同軌核心概念頁（Book）**：\n  - [[concepts/book/OS-Architecture-and-System-Calls|作業系統架構、系統呼叫與核心除錯]]\n  - [[concepts/book/Processes-and-IPC|行程管理與行程間通訊（IPC）]]\n  - [[concepts/book/Threads-and-Concurrency|執行緒、平行運算與隱式多工]]\n  - [[concepts/book/CPU-Scheduling|CPU 排程演算法與多核／即時排程]]", "slides": [{"index": 0, "kind": "cover", "title": "Operating System Concepts (10th Ed.) Ch.1–5 來源筆記", "markdown": ""}, {"index": 1, "kind": "content", "title": "投影片 2", "markdown": "- **來源軌道**：`Book（原文書）`\n- **原始檔案**：`raw/book/Ch1-5 Abraham-Silberschatz-Operating-System-Concepts-10th-2018 (1).pdf`（文字整理：`raw/book/2018-Silberschatz-OS-Concepts-10th-Ch1-5.md`）\n- **作者／出版**：Abrah  Structure）與指標操作解決陣列插入／刪除需搬移資料的瓶頸，並完整推導單向、環狀、雙向與多重鏈結串列的十大基礎演算法與應用。\n\n## 二、涵蓋範圍與核心問題\n\n1. **3-1 Linear List Concepts**：General（Unordered/Random vs. Ordered）與 Restricted（FIFO Queue vs. LIFO Stack）線性串列分類，以及 Insertion、Deletion、Retrieval、Traversal 四大操作。\n2. **3-2 Linked List Concepts**：節點（Node）的自我參照結構、`pHead` 與 Head Node Metadata（`count`、`head`、`pos`、`rear`/`pLast`）。\n3. **3-3 Linked List Algorithms**：十大核心演算法（`createList`、`insertNode`、`deleteNode`、`searchList`、`retrieveNode`、`emptyList`、`fullList`、`listCount`、`getNext`、`destroyList`）。\n4. **3-4 Processing a Linked List**：整合選單系統 `buildLinkedList` 與高階模組（`addNode`、`removeNode`、`printList`）及邊界測試規劃。\n5. **3-5 List Applications**：串列串接（Append Lists）與鏈結串列陣列（Array of Lists，表示二維結構）。\n6. **3-6 Complex Linked List Structures**：環狀鏈結串列（Circularly Linked List）、雙向鏈結串列（Doubly Linked List）與多重鏈結串列（Multilinked List）。\n\n## 三、重點整理與技術／理論細節\n\n- **陣列 vs. 鏈結串列權衡**：陣列易於建立且支援二元搜尋（Binary Search），但插入與刪除需搬移後續元素；鏈結串列不要求實體連續記憶體，插入／刪除僅需修改指標（$O(1)$ 指標重接），但**無法使用二元搜尋**，僅能使用循序搜尋（Sequential Search）。\n- **插入與刪除的簡化歸納（課堂核心考點）**：\n  - **插入（`insertNode`）**：四種情境（空串列、最前、中間、最後）可歸納為兩大類：`pPre == null`（空串列或最前）與 `pPre != null`（中間或最後）。指標賦值順序**不可顛倒**：必須先讓 `pNew->link` 指向後繼者，再更新前驅者（或 `list.head`）指向 `pNew`。\n  - **刪除（`deleteNode`）**：四種情境（唯一節點、第一節點、中間、最後）亦可歸納為兩大類：`pPre == null`（更新 `list.head = pLoc->link`）與 `pPre != null`（更新 `pPre->link = pLoc->link`），最後統一執行 `list.count - 1` 與 `recycle(pLoc)`。\n- **有序搜尋回傳雙指標（`searchList`）**：同時回傳 `pPre`（前驅節點）與 `pLoc`（目標或第一個大於目標之節點），使 `addNode` 與 `removeNode` 可直接複用搜尋結果進行插入或刪除。若 Head 維護 `rear` 指標，可加速判斷 `target > last node`。\n- **雙向鏈結串列課堂勘誤（Slide 102–103）**：簡報特別標註 Algorithm 3-22（`insertDbl`）修正：第 4.9 行 `pPre->fore = pNew` 應移至 4.4.3 行，且第 4.6 行判斷條件應改為 `if (pSucc null)`。\n\n## 四、關鍵圖表、公式或範例紀錄\n\n- **Table 3-1（有序串列搜尋結果對照）**：依 `target` 與節點鍵值關係（`< first`、`== first`、`first < target < last`、`== middle/last`、`> last`）對應不同的 `(pPre, pLoc, Return)` 組合。\n- **Figure 3-18（系統模組架構圖）**：呈現 3 個高階模組（`createList`、`LinkedList`、`destroyList`）與 10 個底層演算法的呼叫階層。\n- **Table 3-2 & Figure 3-25（美國前十任總統多重鏈結串列）**：單一實體節點同時維護 `President link` 與 `Spouse link`，在不複製資料的前提下支援多鍵值順序走訪。\n\n## 五、限制、假設或未解疑問\n\n- 簡報採用虛擬碼（Pseudocode）與 C 語言指標語法（`->`）描述動態記憶體配置（`allocate` / `recycle`），實作時需對應語言的記憶體管理機制（如 C 的 `malloc`/`free`）。\n- 投影片未列出各演算法的形式化時間複雜度大 $O$ 推導表，僅以操作邏輯與指標效率說明（如維護 `rear` 指標可提升效能）。\n\n## 六、與同軌知識庫的關聯\n- **同軌概念頁**：\n  - [線性串列與單向鏈結串列演算法](#deck/concepts/ppt/Linear-and-Singly-Linked-Lists)\n  - [進階鏈結串列結構（環狀、雙向、多重鏈結）](#deck/concepts/ppt/Complex-Linked-Lists)\n- **同軌相關章節**：[資料結構 Ch.4 Stacks 課程簡報摘要](#deck/sources/ppt/DS_Ch4-Stacks)", "rawContent": "# 資料結構 Ch.3 Linked Lists 課程簡報摘要\n\n- **來源軌道**：`PPT（課程簡報）`\n- **原始檔案**：`raw/ppt/DS_Ch3.pdf`（共 58 頁、115 張投影片）\n- **授課教師／作者**：Kuen-Liang Sue（國立中央大學資訊管理學系 IM/NCU）\n\n## 一、一句話核心結論\n\n本簡報系統性介紹線性串列（Linear List）與鏈結串列（Linked List）的資料結構設計，透過自我參照結構（Self-referential Structure）與指標操作解決陣列插入／刪除需搬移資料的瓶頸，並完整推導單向、環狀、雙向與多重鏈結串列的十大基礎演算法與應用。\n\n## 二、涵蓋範圍與核心問題\n\n1. **3-1 Linear List Concepts**：General（Unordered/Random vs. Ordered）與 Restricted（FIFO Queue vs. LIFO Stack）線性串列分類，以及 Insertion、Deletion、Retrieval、Traversal 四大操作。\n2. **3-2 Linked List Concepts**：節點（Node）的自我參照結構、`pHead` 與 Head Node Metadata（`count`、`head`、`pos`、`rear`/`pLast`）。\n3. **3-3 Linked List Algorithms**：十大核心演算法（`createList`、`insertNode`、`deleteNode`、`searchList`、`retrieveNode`、`emptyList`、`fullList`、`listCount`、`getNext`、`destroyList`）。\n4. **3-4 Processing a Linked List**：整合選單系統 `buildLinkedList` 與高階模組（`addNode`、`removeNode`、`printList`）及邊界測試規劃。\n5. **3-5 List Applications**：串列串接（Append Lists）與鏈結串列陣列（Array of Lists，表示二維結構）。\n6. **3-6 Complex Linked List Structures**：環狀鏈結串列（Circularly Linked List）、雙向鏈結串列（Doubly Linked List）與多重鏈結串列（Multilinked List）。\n\n## 三、重點整理與技術／理論細節\n\n- **陣列 vs. 鏈結串列權衡**：陣列易於建立且支援二元搜尋（Binary Search），但插入與刪除需搬移後續元素；鏈結串列不要求實體連續記憶體，插入／刪除僅需修改指標（$O(1)$ 指標重接），但**無法使用二元搜尋**，僅能使用循序搜尋（Sequential Search）。\n- **插入與刪除的簡化歸納（課堂核心考點）**：\n  - **插入（`insertNode`）**：四種情境（空串列、最前、中間、最後）可歸納為兩大類：`pPre == null`（空串列或最前）與 `pPre != null`（中間或最後）。指標賦值順序**不可顛倒**：必須先讓 `pNew->link` 指向後繼者，再更新前驅者（或 `list.head`）指向 `pNew`。\n  - **刪除（`deleteNode`）**：四種情境（唯一節點、第一節點、中間、最後）亦可歸納為兩大類：`pPre == null`（更新 `list.head = pLoc->link`）與 `pPre != null`（更新 `pPre->link = pLoc->link`），最後統一執行 `list.count - 1` 與 `recycle(pLoc)`。\n- **有序搜尋回傳雙指標（`searchList`）**：同時回傳 `pPre`（前驅節點）與 `pLoc`（目標或第一個大於目標之節點），使 `addNode` 與 `removeNode` 可直接複用搜尋結果進行插入或刪除。若 Head 維護 `rear` 指標，可加速判斷 `target > last node`。\n- **雙向鏈結串列課堂勘誤（Slide 102–103）**：簡報特別標註 Algorithm 3-22（`insertDbl`）修正：第 4.9 行 `pPre->fore = pNew` 應移至 4.4.3 行，且第 4.6 行判斷條件應改為 `if (pSucc null)`。\n\n## 四、關鍵圖表、公式或範例紀錄\n\n- **Table 3-1（有序串列搜尋結果對照）**：依 `target` 與節點鍵值關係（`< first`、`== first`、`first < target < last`、`== middle/last`、`> last`）對應不同的 `(pPre, pLoc, Return)` 組合。\n- **Figure 3-18（系統模組架構圖）**：呈現 3 個高階模組（`createList`、`LinkedList`、`destroyList`）與 10 個底層演算法的呼叫階層。\n- **Table 3-2 & Figure 3-25（美國前十任總統多重鏈結串列）**：單一實體節點同時維護 `President link` 與 `Spouse link`，在不複製資料的前提下支援多鍵值順序走訪。\n\n## 五、限制、假設或未解疑問\n\n- 簡報採用虛擬碼（Pseudocode）與 C 語言指標語法（`->`）描述動態記憶體配置（`allocate` / `recycle`），實作時需對應語言的記憶體管理機制（如 C 的 `malloc`/`free`）。\n- 投影片未列出各演算法的形式化時間複雜度大 $O$ 推導表，僅以操作邏輯與指標效率說明（如維護 `rear` 指標可提升效能）。\n\n## 六、與同軌知識庫的關聯\n- **同軌概念頁**：\n  - [[concepts/ppt/Linear-and-Singly-Linked-Lists|線性串列與單向鏈結串列演算法]]\n  - [[concepts/ppt/Complex-Linked-Lists|進階鏈結串列結構（環狀、雙向、多重鏈結）]]\n- **同軌相關章節**：[[sources/ppt/DS_Ch4-Stacks|資料結構 Ch.4 Stacks 課程簡報摘要]]", "slides": [{"index": 0, "kind": "cover", "title": "資料結構 Ch.3 Linked Lists 課程簡報摘要", "markdown": ""}, {"index": 1, "kind": "content", "title": "投影片 2", "markdown": "- **來源軌道**：`PPT（課程簡報）`\n- **原始檔案**：`raw/ppt/DS_Ch3.pdf`（共 58 頁、115 張投影片）\n- **授課教師／作者**：Kuen-Liang Sue（國立中央大學資訊管理學系 IM/NCU）"}, {"index": 2, "kind": "content", "title": "一、一句話核心結論", "markdown": "## 一、一句話核心結論\n\n本簡報系統性介紹線性串列（Linear List）與鏈結串列（Linked List）的資料結構設計，透過自我參照結構（Self-referential Structure）與指標操作解決陣列插入／刪除需搬移資料的瓶頸，並完整推導單向、環狀、雙向與多重鏈結串列的十大基礎演算法與應用。"}, {"index": 3, "kind": "content", "title": "二、涵蓋範圍與核心問題", "markdown": "## 二、涵蓋範圍與核心問題\n\n1. **3-1 Linear List Concepts**：  10 個底層演算法的呼叫階層。\n- **Table 3-2 & Figure 3-25（美國前十任總統多重鏈結串列）**：單一實體節點同時維護 `President link` 與 `Spouse link`，在不複製資料的前提下支援多鍵值順序走訪。"}, {"index": 6, "kind": "content", "title": "五、限制、假設或未解疑問", "markdown": "## 五、限制、假設或未解疑問\n\n- 簡報採用虛擬碼（Pseudocode）與 C 語言指標語法（`->`）描述動態記憶體配置（`allocate` / `recycle`），實作時需對應語言的記憶體管理機制（如 C 的 `malloc`/`free`）。\n- 投影片未列出各演算法的形式化時間複雜度大 $O$ 推導表，僅以操作邏輯與指標效率說明（如維護 `rear` 指標可提升效能）。"}, {"index": 7, "kind": "content", "title": "六、與同軌知識庫的關聯", "markdown": "## 六、與同軌知識庫的關聯\n- **同軌概念頁**：\n  - [線性串列與單向鏈結串列演算法](#deck/concepts/ppt/Linear-and-Singly-Linked-Lists)\n  - [進階鏈結串列結構（環狀、雙向、多重鏈結）](#deck/concepts/ppt/Complex-Linked-Lists)\n- **同軌相關章節**：[資料結構 Ch.4 Stacks 課程簡報摘要](#deck/sources/ppt/DS_Ch4-Stacks)"}], "sourceRefs": [], "backlinks": [{"slug": "concepts/ppt/Complex-Linked-Lists", "label": "進階鏈結串列結構（環狀、雙向、多重鏈結）"}, {"slug": "concepts/ppt/Linear-and-Singly-Linked-Lists", "label": "線性串列與單向鏈結串列演算法"}, {"slug": "overview", "label": "課程簡報與原文書知識庫全域總覽"}, {"slug": "sources/ppt/DS_Ch4-Stacks", "label": "資料結構 Ch.4 Stacks 課程簡報摘要"}]}, {"slug": "sources/ppt/DS_Ch4-Stacks", "frontmatter": {"title": "資料結構 Ch.4 Stacks 課程簡報摘要", "type": "source", "source_type": "ppt", "tags": ["course-notes", "ppt", "data-structures", "stack", "source"], "created": "2026-11-16", "updated": "2026-11-16", "sources": [], "status": "growing", "authors": "Kuen-Liang Sue (IM/NCU)", "raw_file": "raw/ppt/DS_Ch4.pdf"}, "content": "# 資料結構 Ch.4 Stacks 課程簡報摘要\n\n- **來源軌道**：`PPT（課程簡報）`\n- **原始檔案**：`raw/ppt/DS_Ch4.pdf`（共 42 頁、84 張投影片）\n- **授課教師／作者**：Kuen-Liang Sue（國立中央大學資訊管理學系 IM/NCU）\n\n## 一、一句話核心結論\n\n本簡報定義堆疊（Stack）為後進先出（LIFO）的受限線性串列，說明其鏈結串列與陣列兩種抽象資料型別（ADT）實作方式，並深入演練資料反轉、括號解析、中序轉後序與求值、以及回溯法（目標搜尋與八皇后問題）四大核心應用。\n\n## 二、涵蓋範圍與核心問題\n\n1. **Basic Stack Operations**：LIFO 特性與三大基本操作（`Push`、`Pop`、`Stack Top`）及溢位／下溢邊界條件（Overflow / Underflow）。\n2. **Stack Linked List Implementation**：堆疊頭節點（`count`, `top`）與資料節點（`data`, `next`），以及八大基本操作（含 `emptyStack`、`fullStack`、`stackCount`、`destroyStack`）。\n3. **Stack Applications**：四大應用分類——**Reversing Data**、**Parsing Data**、**Postponing Data Usage**、**Backtracking Steps**。\n4. **Stack Abstract Data Type (ADT) Implementation**：以資料隱藏（Data Hiding）原則將堆疊封裝為可重用函式庫。\n5. **Stack ADT - Array Implementation**：已知最大容量時的陣列實作結構（`stackAry`、`count`、`stackMax`、`top` 索引）。\n\n## 三、重點整理與技術／理論細節\n\n- **三大核心操作差異**：\n  - `Push`：將資料放入頂端，需檢查是否空間不足（**Overflow**）。\n  - `Pop`：移除頂端元素並回傳給呼叫端，空堆疊時發生 **Underflow**。\n  - `Stack Top`：複製並回傳頂端元素**但不刪除**，空堆疊時同樣發生 **Underflow**。\n- **資料隱藏（Data Hiding）設計**：雖然 `emptyStack`、`stackCount` 等操作僅包含單行判斷或回傳 `stack.count`，仍需獨立封裝為模組，因為呼叫端程式（User）不應直接存取堆疊內部結構。\n- **中序轉後序（Infix to Postfix）優先權規則**：\n  - 運算子優先權：Priority 2（`*`, `/`）> Priority 1（`+`, `-`）> Priority 0（`(`）。\n  - 遇到運算元直接輸出；遇到 `(` 推入堆疊；遇到 `)` 連續彈出並輸出直到遇見 `(`；遇到一般運算子時，若堆疊非空且 `priority(token) <= priority(topToken)`，先彈出並輸出堆疊頂端運算子，再將新運算子推入。\n- **後序式求值（Postfix Evaluation）**：堆疊內存放的是**運算元數值**（而非變數名稱）；讀到運算子時依序彈出 `operand2` 與 `operand1`，計算 `operand1 operator operand2` 後推回堆疊。\n- **鏈結串列 vs. 陣列實作選擇**：若程式撰寫前即可計算出堆疊的最大元素數量，使用**陣列實作**更有效率（無需 `next` 指標欄位與動態記憶體配置，`top` 為陣列索引）。\n\n## 四、關鍵圖表、公式或範例紀錄\n\n- **Table 4-1（中序轉後序逐步追蹤）**：完整追蹤 `A * B - ( C + D ) + E` 轉換為 `A B * C D + - E +` 的 Input Buffer、Operator Stack 與 Output String 狀態。\n- **Figure 4-13（後序求值追蹤）**：以 `2 4 6 + *` 為例演示運算元堆疊變化，得出結果 `20`。\n- **Figure 4-14 & 4-15（目標搜尋回溯）**：展示分支點（如 `B12`、`B8`、`B9`、`B17`）如何透過堆疊記憶決策點並在死路時回溯至目標節點 `16`。\n- **Figure 4-17（四皇后問題步驟圖）**：以 $4 \\times 4$ 棋盤逐步示範皇后擺放與失敗回溯（Step 1–8），最終解為 `(1,2), (2,4), (3,1), (4,3)`。\n\n## 五、限制、假設或未解疑問\n\n- `inToPostFix`（Algorithm 4-12）假設輸入的中序運算式已先經過語法驗證（無括號不對稱或非法運算子）。\n- 投影片提及 Section 4-4 有 C++ 實作範例，但未完整展開於本份 PPT 投影片內（`[待確認]` 需參閱對應教科書章節）。\n\n## 六、與同軌知識庫的關聯\n- **同軌概念頁**：\n  - [堆疊（Stack）資料結構、ADT 實作與四大應用](#deck/concepts/ppt/Stacks-and-Applications)\n- **同軌相關章節**：[資料結構 Ch.3 Linked Lists 課程簡報摘要](#deck/sources/ppt/DS_Ch3-Linked-Lists)", "rawContent": "# 資料結構 Ch.4 Stacks 課程簡報摘要\n\n- **來源軌道**：`PPT（課程簡報）`\n- **原始檔案**：`raw/ppt/DS_Ch4.pdf`（共 42 頁、84 張投影片）\n- **授課教師／作者**：Kuen-Liang Sue（國立中央大學資訊管理學系 IM/NCU）\n\n#     const state = {
      route: "home",
      activeSlug: null,
      activeTab: "ppt",
      searchQuery: "",
      selectedTag: null,
      viewerMode: "slides",
      slideIndex: 0,
      showOutline: true,
    };

    function sourceBadgeHtml(sourceType) {
      if (sourceType === "ppt") {
        return `<span class="inline-flex items-center px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider bg-black text-white">PPT 簡報</span>`;
      }
      if (sourceType === "book") {
        return `<span class="inline-flex items-center px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider bg-white text-black border-2 border-black">BOOK 原文書</span>`;
      }
      return `<span class="inline-flex items-center px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider bg-orange-600 text-white">MIXED 對照</span>`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderMarkdown(md) {
      if (window.marked) {
        marked.setOptions({ gfm: true, breaks: false });
        return marked.parse(md || "");
      }
      return `<pre>${escapeHtml(md || "")}</pre>`;
    }

    function applyMath(container) {
      if (window.renderMathInElement && container) {
        try {
          renderMathInElement(container, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
            ],
            throwOnError: false,
          });
        } catch (e) {}
      }
    }

    function syncHashFromState() {
      if (state.route === "home") {
        if (location.hash !== "#home" && location.hash !== "") {
          history.replaceState(null, "", "#home");
        }
      } else if (state.route === "deck" && state.activeSlug) {
        const targetHash = `#deck/${state.activeSlug}`;
        if (location.hash !== targetHash) {
          history.replaceState(null, "", targetHash);
        }
      }
    }

    function loadStateFromHash() {
      const h = decodeURIComponent(location.hash || "");
      if (h.startsWith("#deck/")) {
        const slug = h.slice(6);
        const found = WIKI_DATA.pages.find((p) => p.slug === slug);
        if (found) {
          state.route = "deck";
          state.activeSlug = slug;
          state.slideIndex = 0;
          return;
        }
      }
      state.route = "home";
      state.activeSlug = null;
    }

    function openDeck(slug) {
      state.route = "deck";
      state.activeSlug = slug;
      state.slideIndex = 0;
      state.viewerMode = "slides";
      syncHashFromState();
      render();
      window.scrollTo(0, 0);
    }

    function goHome() {
      state.route = "home";
      state.activeSlug = null;
      syncHashFromState();
      render();
      window.scrollTo(0, 0);
    }

    function renderHome() {
      const pages = WIKI_DATA.pages;
      const deckPages = pages.filter((p) => p.frontmatter.type !== "overview");
      const overview = pages.find((p) => p.frontmatter.type === "overview");

      const pptSources = pages.filter((p) => p.frontmatter.type === "source" && p.frontmatter.source_type === "ppt").length;
      const pptConcepts = pages.filter((p) => p.frontmatter.type === "concept" && p.frontmatter.source_type === "ppt").length;
      const bookSources = pages.filter((p) => p.frontmatter.type === "source" && p.frontmatter.source_type === "book").length;
      const bookConcepts = pages.filter((p) => p.frontmatter.type === "concept" && p.frontmatter.source_type === "book").length;
      const comparisons = pages.filter((p) => p.frontmatter.type === "comparison").length;

      const allTags = Array.from(
        new Set(deckPages.flatMap((p) => p.frontmatter.tags || []))
      ).sort();

      const q = state.searchQuery.trim().toLowerCase();
      const filtered = deckPages.filter((p) => {
        if (state.activeTab === "ppt" && p.frontmatter.source_type !== "ppt") return false;
        if (state.activeTab === "book" && p.frontmatter.source_type !== "book") return false;
        if (state.activeTab === "comparisons" && p.frontmatter.type !== "comparison") return false;
        if (state.selectedTag && !(p.frontmatter.tags || []).includes(state.selectedTag)) return false;
        if (q) {
          const hay = (p.frontmatter.title + "\n" + p.rawContent + "\n" + (p.frontmatter.tags || []).join(" ")).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const tabs = [
        { id: "ppt", label: "課程簡報軌道（PPT）" },
        { id: "book", label: "原文書軌道（BOOK）" },
        { id: "comparisons", label: "跨來源對照（COMPARISONS）" },
        { id: "all", label: "全部簡報（ALL）" },
      ];

      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10">
          <!-- Header -->
          <header class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 border-b-4 border-black pb-6">
            <div>
              <div class="font-mono text-xs font-bold uppercase tracking-widest text-orange-600 mb-2">
                LLM WIKI · SWISS KEYNOTE EDITION
              </div>
              <h1 class="text-3xl sm:text-4xl font-black tracking-tight text-black">
                課程簡報與原文書知識庫
              </h1>
              <p class="text-neutral-600 mt-2 text-sm">
                雙軌物理分離（PPT 課程簡報 ／ Book 原文書），高對比網格簡報呈現。
              </p>
            </div>
            ${overview ? `
              <button onclick="openDeck('overview')" class="inline-flex items-center gap-2 px-5 py-3 bg-black text-white text-xs font-bold uppercase tracking-wider hover:bg-orange-600 transition-colors shrink-0">
                開啟全域總覽簡報（${overview.slides.length} 頁） →
              </button>
            ` : ""}
          </header>

          <!-- Stats Grid -->
          <section class="grid grid-cols-2 lg:grid-cols-4 border-2 border-black divide-y-2 lg:divide-y-0 lg:divide-x-2 divide-black bg-white">
            <div class="p-5">
              <div class="font-mono text-xs font-bold uppercase tracking-wider text-neutral-500">PPT 課程簡報</div>
              <div class="mt-2 flex items-baseline gap-3">
                <span class="text-3xl font-black text-black">${pptSources + pptConcepts}</span>
                <span class="font-mono text-xs text-neutral-600">${pptSources} SRC / ${pptConcepts} CPT</span>
              </div>
            </div>
            <div class="p-5">
              <div class="font-mono text-xs font-bold uppercase tracking-wider text-neutral-500">BOOK 原文書</div>
              <div class="mt-2 flex items-baseline gap-3">
                <span class="text-3xl font-black text-black">${bookSources + bookConcepts}</span>
                <span class="font-mono text-xs text-neutral-600">${bookSources} SRC / ${bookConcepts} CPT</span>
              </div>
            </div>
            <div class="p-5">
              <div class="font-mono text-xs font-bold uppercase tracking-wider text-neutral-500">跨來源對照</div>
              <div class="mt-2 flex items-baseline gap-3">
                <span class="text-3xl font-black text-black">${comparisons}</span>
                <span class="font-mono text-xs text-neutral-600">COMPARISONS</span>
              </div>
            </div>
            <div class="p-5 bg-neutral-100">
              <div class="font-mono text-xs font-bold uppercase tracking-wider text-orange-600">TOTAL DECKS</div>
              <div class="mt-2 flex items-baseline gap-3">
                <span class="text-3xl font-black text-black">${pages.length}</span>
                <span class="font-mono text-xs text-neutral-600">含全域總覽</span>
              </div>
            </div>
          </section>

          <!-- Main Content -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <div class="lg:col-span-2 space-y-6">
              <!-- Track Tabs -->
              <div class="flex flex-wrap items-center gap-2 border-b-2 border-black pb-4">
                ${tabs.map((t) => `
                  <button onclick="setTab('${t.id}')" class="px-4 py-2 text-xs font-bold uppercase tracking-wider transition-colors ${
                    state.activeTab === t.id
                      ? "bg-black text-white"
                      : "bg-white text-black border-2 border-black hover:bg-neutral-100"
                  }">${t.label}</button>
                `).join("")}
              </div>

              <!-- Search & Tags -->
              <div class="space-y-3">
                <input
                  id="searchInput"
                  type="text"
                  value="${escapeHtml(state.searchQuery)}"
                  oninput="setSearch(this.value)"
                  placeholder="搜尋簡報標題、內文關鍵字或標籤..."
                  class="w-full px-4 py-2.5 bg-white border-2 border-black text-sm font-medium focus:outline-none focus:border-orange-600"
                />
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="font-mono text-xs font-bold uppercase text-neutral-500 mr-1">TAGS:</span>
                  <button onclick="setTag(null)" class="px-2.5 py-1 text-xs font-mono font-bold ${state.selectedTag === null ? "bg-orange-600 text-white" : "bg-white border border-black text-black hover:bg-neutral-100"}">ALL</button>
                  ${allTags.map((tag) => `
                    <button onclick="setTag('${escapeHtml(tag)}')" class="px-2.5 py-1 text-xs font-mono font-bold ${state.selectedTag === tag ? "bg-orange-600 text-white" : "bg-white border border-black text-black hover:bg-neutral-100"}">#${escapeHtml(tag)}</button>
                  `).join("")}
                </div>
              </div>

              <!-- Cards -->
              ${filtered.length === 0 ? `
                <div class="border-2 border-dashed border-black p-10 text-center text-neutral-600 text-sm font-mono">
                  目前此軌道或篩選條件下尚無簡報頁面。
                </div>
              ` : `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                  ${filtered.map((p) => `
                    <div onclick="openDeck('${escapeHtml(p.slug)}')" class="cursor-pointer group bg-white border-2 border-black p-5 hover:border-orange-600 transition-colors flex flex-col justify-between gap-5">
                      <div class="space-y-3">
                        <div class="flex items-center justify-between gap-2">
                          ${sourceBadgeHtml(p.frontmatter.source_type)}
                          <span class="font-mono text-xs font-bold text-neutral-500 uppercase">${escapeHtml(p.frontmatter.type)} · ${p.slides.length} SLIDES</span>
                        </div>
                        <h2 class="text-lg font-black tracking-tight text-black group-hover:text-orange-600 transition-colors">${escapeHtml(p.frontmatter.title)}</h2>
                        <div class="flex flex-wrap gap-1.5">
                          ${(p.frontmatter.tags || []).slice(0, 4).map((t) => `<span class="px-2 py-0.5 bg-neutral-100 border border-neutral-300 text-neutral-700 font-mono text-xs">#${escapeHtml(t)}</span>`).join("")}
                        </div>
                      </div>
                      <div class="flex items-center justify-between pt-3 border-t border-neutral-300 font-mono text-xs">
                        <span class="text-neutral-500">${escapeHtml(p.frontmatter.updated || "—")}</span>
                        <span class="font-bold text-orange-600 uppercase">OPEN DECK →</span>
                      </div>
                    </div>
                  `).join("")}
                </div>
              `}
            </div>

            <!-- Log Sidebar -->
            <aside class="bg-white border-2 border-black p-5 space-y-5">
              <div class="border-b-2 border-black pb-3">
                <h2 class="font-mono text-xs font-bold uppercase tracking-widest text-black">RECENT LOG · 更新紀錄</h2>
              </div>
              <div class="space-y-4">
                ${WIKI_DATA.logs.slice(0, 6).map((entry) => `
                  <div class="pl-4 border-l-4 border-orange-600 space-y-1">
                    <div class="flex items-center gap-2 font-mono text-xs">
                      <span class="font-bold text-black">${escapeHtml(entry.date)}</span>
                      <span class="px-1.5 py-0.5 bg-black text-white uppercase font-bold">${escapeHtml(entry.action)}</span>
                    </div>
                    <p class="text-sm font-bold text-black">${escapeHtml(entry.title)}</p>
                    ${entry.details.length ? `<p class="text-xs text-neutral-600">${escapeHtml(entry.details[entry.details.length - 1])}</p>` : ""}
                  </div>
                `).join("")}
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    function renderDeck() {
      const page = WIKI_DATA.pages.find((p) => p.slug === state.activeSlug);
      if (!page) {
        goHome();
        return "";
      }

      const total = page.slides.length;
      const idx = Math.min(Math.max(0, state.slideIndex), total - 1);
      state.slideIndex = idx;
      const slide = page.slides[idx];
      const progress = total > 0 ? Math.round(((idx + 1) / total) * 100) : 100;

      const otherTrack = page.frontmatter.source_type === "ppt" ? "book" : (page.frontmatter.source_type === "book" ? "ppt" : null);
      const crossTrack = otherTrack
        ? WIKI_DATA.pages.filter((p) => p.frontmatter.source_type === otherTrack && p.frontmatter.type === "concept")
        : [];

      const mainColSpan = state.viewerMode === "slides" && state.showOutline ? "lg:col-span-6" : "lg:col-span-9";

      return `
        <div class="min-h-screen flex flex-col bg-neutral-100">
          <!-- Top Bar -->
          <header class="bg-white border-b-2 border-black px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20">
            <div class="flex items-center gap-3 min-w-0">
              <button onclick="goHome()" class="px-3 py-1.5 border-2 border-black bg-white text-black text-xs font-mono font-bold uppercase hover:bg-black hover:text-white transition-colors">
                ← INDEX
              </button>
              ${sourceBadgeHtml(page.frontmatter.source_type)}
              <h1 class="text-sm sm:text-base font-black tracking-tight text-black truncate">${escapeHtml(page.frontmatter.title)}</h1>
            </div>

            <div class="flex items-center gap-2">
              ${state.viewerMode === "slides" ? `
                <button onclick="toggleOutline()" class="px-3 py-1.5 text-xs font-mono font-bold uppercase border-2 border-black bg-white text-black hover:bg-neutral-100">
                  ${state.showOutline ? "HIDE OUTLINE" : "SHOW OUTLINE"}
                </button>
              ` : ""}
              <div class="inline-flex border-2 border-black bg-white">
                <button onclick="setViewerMode('slides')" class="px-3 py-1.5 text-xs font-mono font-bold uppercase ${state.viewerMode === "slides" ? "bg-black text-white" : "text-black hover:bg-neutral-100"}">SLIDES</button>
                <button onclick="setViewerMode('document')" class="px-3 py-1.5 text-xs font-mono font-bold uppercase border-l-2 border-black ${state.viewerMode === "document" ? "bg-black text-white" : "text-black hover:bg-neutral-100"}">READ</button>
              </div>
            </div>
          </header>

          ${state.viewerMode === "slides" ? `
            <div class="w-full h-1.5 bg-neutral-300">
              <div class="h-full bg-orange-600 transition-all duration-300" style="width: ${progress}%"></div>
            </div>
          ` : ""}

          <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            ${state.viewerMode === "slides" && state.showOutline ? `
              <aside class="lg:col-span-3 bg-white border-2 border-black p-4 space-y-3 lg:sticky lg:top-20 max-h-[75vh] overflow-y-auto">
                <div class="font-mono text-xs font-bold uppercase tracking-widest text-neutral-500 border-b border-neutral-300 pb-2">
                  OUTLINE · ${total} SLIDES
                </div>
                <nav class="space-y-1">
                  ${page.slides.map((s, i) => `
                    <button onclick="goSlide(${i})" class="w-full text-left px-3 py-2 text-xs font-bold flex items-start gap-2 transition-colors ${
                      i === idx ? "bg-black text-white" : "text-black hover:bg-neutral-100"
                    }">
                      <span class="font-mono shrink-0 ${i === idx ? "text-orange-400" : "text-neutral-400"}">${String(i + 1).padStart(2, "0")}</span>
                      <span>${escapeHtml(s.title)}</span>
                    </button>
                  `).join("")}
                </nav>
              </aside>
            ` : ""}

            <main class="${mainColSpan}">
              ${state.viewerMode === "slides" ? `
                <div class="space-y-4">
                  <div class="bg-white border-2 border-black p-8 sm:p-12 min-h-[500px] flex flex-col justify-between">
                    ${slide.kind === "cover" ? `
                      <div class="my-auto space-y-6">
                        <div class="flex flex-wrap items-center gap-3">
                          ${sourceBadgeHtml(page.frontmatter.source_type)}
                          <span class="font-mono text-xs font-bold uppercase tracking-widest text-orange-600">${escapeHtml(page.frontmatter.type)} · ${escapeHtml(page.frontmatter.status)}</span>
                        </div>
                        <h2 class="text-3xl sm:text-4xl font-black tracking-tight text-black leading-tight">${escapeHtml(page.frontmatter.title)}</h2>
                        ${page.frontmatter.authors ? `<p class="font-mono text-xs text-neutral-600 uppercase">AUTHOR / INSTRUCTOR: ${escapeHtml(page.frontmatter.authors)}</p>` : ""}
                        <div class="flex flex-wrap gap-2">
                          ${(page.frontmatter.tags || []).map((t) => `<span class="px-2.5 py-1 bg-neutral-100 border border-black text-black font-mono text-xs font-bold">#${escapeHtml(t)}</span>`).join("")}
                        </div>
                        <div class="pt-5 border-t-2 border-black flex flex-wrap items-center gap-6 font-mono text-xs text-neutral-600">
                          <span>UPDATED: ${escapeHtml(page.frontmatter.updated || "—")}</span>
                          ${page.frontmatter.raw_file ? `<span>RAW: ${escapeHtml(page.frontmatter.raw_file)}</span>` : ""}
                        </div>
                      </div>
                    ` : `
                      <div id="markdownTarget" class="wiki-prose flex-1">${renderMarkdown(slide.markdown)}</div>
                    `}
                    <div class="mt-8 pt-4 border-t border-neutral-300 flex items-center justify-between font-mono text-xs font-bold uppercase tracking-wider">
                      <span class="text-neutral-500">${escapeHtml(page.slug)}</span>
                      <span class="text-orange-600">${String(idx + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}</span>
                    </div>
                  </div>

                  <div class="flex items-center justify-between bg-white border-2 border-black px-4 py-3">
                    <button onclick="prevSlide()" ${idx === 0 ? "disabled" : ""} class="px-4 py-2 text-xs font-mono font-bold uppercase border-2 border-black bg-white text-black hover:bg-black hover:text-white disabled:opacity-30">← PREV</button>
                    <span class="font-mono text-xs font-bold text-neutral-600">KEYBOARD ← / →</span>
                    <button onclick="nextSlide()" ${idx >= total - 1 ? "disabled" : ""} class="px-4 py-2 text-xs font-mono font-bold uppercase bg-orange-600 text-white hover:bg-black disabled:opacity-30">NEXT →</button>
                  </div>
                </div>
              ` : `
                <article class="bg-white border-2 border-black p-8 sm:p-12 space-y-6">
                  <div class="border-b-4 border-black pb-6 space-y-3">
                    <div class="flex flex-wrap items-center gap-3">
                      ${sourceBadgeHtml(page.frontmatter.source_type)}
                      <span class="font-mono text-xs font-bold text-neutral-500 uppercase">UPDATED: ${escapeHtml(page.frontmatter.updated || "—")}</span>
                    </div>
                    <h2 class="text-3xl font-black tracking-tight text-black">${escapeHtml(page.frontmatter.title)}</h2>
                  </div>
                  <div id="markdownTarget" class="wiki-prose">${renderMarkdown(page.content)}</div>
                </article>
              `}
            </main>

            <aside class="lg:col-span-3 space-y-4 lg:sticky lg:top-20">
              <div class="bg-white border-2 border-black p-4 space-y-3">
                <div class="font-mono text-xs font-bold uppercase tracking-widest text-black border-b border-neutral-300 pb-2">SOURCES · 來源出處</div>
                ${page.sourceRefs.length === 0 ? `
                  <p class="font-mono text-xs text-neutral-600">${page.frontmatter.raw_file ? `RAW: ${escapeHtml(page.frontmatter.raw_file)}` : "本頁為來源或總覽頁面。"}</p>
                ` : `
                  <ul class="space-y-2">
                    ${page.sourceRefs.map((r) => `
                      <li>
                        <button onclick="openDeck('${escapeHtml(r.slug)}')" class="w-full text-left flex items-center justify-between gap-2 p-2 border border-black bg-neutral-50 hover:bg-orange-600 hover:text-white text-xs font-bold transition-colors">
                          <span class="truncate">${escapeHtml(r.label)}</span>
                          <span>→</span>
                        </button>
                      </li>
                    `).join("")}
                  </ul>
                `}
              </div>

              <div class="bg-white border-2 border-black p-4 space-y-3">
                <div class="font-mono text-xs font-bold uppercase tracking-widest text-black border-b border-neutral-300 pb-2">BACKLINKS · ${page.backlinks.length}</div>
                ${page.backlinks.length === 0 ? `<p class="text-xs text-neutral-500 font-mono">NO BACKLINKS</p>` : `
                  <ul class="space-y-1.5">
                    ${page.backlinks.map((b) => `
                      <li>
                        <button onclick="openDeck('${escapeHtml(b.slug)}')" class="w-full text-left px-2.5 py-1.5 text-xs font-bold text-black hover:bg-neutral-100 hover:text-orange-600 truncate">
                          ← ${escapeHtml(b.label)}
                        </button>
                      </li>
                    `).join("")}
                  </ul>
                `}
              </div>

              ${crossTrack.length > 0 ? `
                <div class="bg-white border-2 border-black p-4 space-y-3">
                  <div class="font-mono text-xs font-bold uppercase tracking-widest text-orange-600 border-b border-neutral-300 pb-2">OTHER TRACK · 他軌快速切換</div>
                  <ul class="space-y-1.5">
                    ${crossTrack.slice(0, 5).map((c) => `
                      <li>
                        <button onclick="openDeck('${escapeHtml(c.slug)}')" class="w-full text-left flex items-center justify-between gap-2 px-2.5 py-1.5 text-xs font-bold text-black hover:bg-neutral-100 hover:text-orange-600">
                          <span class="truncate">${escapeHtml(c.title)}</span>
                          <span>→</span>
                        </button>
                      </li>
                    `).join("")}
                  </ul>
                </div>
              ` : ""}
            </aside>
          </div>
        </div>
      `;
    }

    function setTab(t) { state.activeTab = t; render(); }
    function setSearch(q) {
      state.searchQuery = q;
      const input = document.getElementById("searchInput");
      const pos = input ? input.selectionStart : q.length;
      render();
      const newInput = document.getElementById("searchInput");
      if (newInput) { newInput.focus(); newInput.setSelectionRange(pos, pos); }
    }
    function setTag(tag) { state.selectedTag = state.selectedTag === tag ? null : tag; render(); }
    function setViewerMode(m) { state.viewerMode = m; render(); }
    function toggleOutline() { state.showOutline = !state.showOutline; render(); }
    function goSlide(i) { state.slideIndex = i; render(); }
    function prevSlide() { if (state.slideIndex > 0) { state.slideIndex--; render(); } }
    function nextSlide() {
      const page = WIKI_DATA.pages.find((p) => p.slug === state.activeSlug);
      if (page && state.slideIndex < page.slides.length - 1) { state.slideIndex++; render(); }
    }

    window.addEventListener("keydown", (e) => {
      if (state.route === "deck" && state.viewerMode === "slides") {
        if (e.key === "ArrowLeft") prevSlide();
        if (e.key === "ArrowRight") nextSlide();
      }
    });

    window.addEventListener("hashchange", () => {
      loadStateFromHash();
      render();
    });

    function render() {
      const app = document.getElementById("app");
      app.innerHTML = state.route === "deck" ? renderDeck() : renderHome();
      const target = document.getElementById("markdownTarget");
      if (target) applyMath(target);
    }

    loadStateFromHash();
    render();
  </script>
</body>
</html>
