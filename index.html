  <script>
    const WIKI_DATA = {"pages": [{"slug": "concepts/book/CPU-Scheduling", "frontmatter": {"title": "CPU 排程演算法與多核／即時排程", "type": "concept", "source_type": "book", "tags": ["course-notes", "book", "operating-systems", "scheduling", "multicore", "real-time"], "created": "2026-11-16", "updated": "2026-11-16", "sources": ["[[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5]]"], "status": "growing", "authors": "", "raw_file": ""}, "content": "# CPU 排程演算法與多核／即時排程\n\n## 一、排程基礎與評估準則\n\n根據 [Operating System Concepts (Ch.5)](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)，現代作業系統排程的實際對象是 **Kernel-Level Threads**。\n\n- **CPU–I/O Burst Cycle**：行程執行在 CPU Burst 與 I/O Wait 之間交替；實測顯示 CPU Burst 呈指數分布（大量短 Burst、少數長 Burst）。\n- **Preemptive（搶占式）vs. Nonpreemptive（非搶占式）**：當排程僅在行程「主動等待 I/O」或「終止」時發生，稱為 Nonpreemptive；若允許於「中斷返回」或「I/O 完成喚醒」時切換 CPU，則為 Preemptive。現代 OS 核心本身亦多為搶占式（需以 Mutex 等機制保護核心共享資料）。\n- **Dispatcher**：負責執行 Context Switch、切換至 User Mode 並跳轉回使用者程式位置；其耗時稱為 **Dispatch Latency**。\n- **五大評估準則**：最大化 **CPU Utilization**（實務目標 40%–90%）與 **Throughput**；最小化 **Turnaround Time**、**Waiting Time** 與 **Response Time**（互動式系統尤重降低回應時間變異數）。\n\n---\n\n## 二、經典單核排程演算法比較\n\n| 演算法 | 搶占性 | 核心策略與特性 | 主要優缺點 |\n| :--- | :--- | :--- | :--- |\n| **FCFS** | 非搶占 | 依請求順序以 FIFO 佇列服務 | 實作最簡，但長行程會阻塞後方短行程，造成 **Convoy Effect** |\n| **SJF / SRTF** | 非搶占 / 搶占 | 依下一次 CPU Burst 長度由短到長排程（搶占版稱 SRTF） | 理論上具備**最小平均等待時間**；實務無法預知未來長度，需以指數平均 $\\tau_{n+1} = \\alpha t_n + (1-\\alpha)\\tau_n$ 預測 |\n| **Round-Robin (RR)** | 搶占 | 每個行程最多執行一個 Time Quantum $q$（10–100 ms）後排回佇列尾端 | 公平且回應佳；$q$ 過大退化為 FCFS，過小 Context Switch 開銷大（經驗法則：80% CPU burst $< q$） |\n| **Priority** | 兩者皆可 | 依靜態或動態優先權排程 | 可能導致低優先權行程 **Starvation（飢餓）**，需搭配 **Aging**（隨等待時間提升優先權）解決 |\n| **Multilevel Queue** | 依佇列設計 | 依行程類型（即時、系統、互動、批次）分入固定佇列，各自套用演算法 | 排程開銷低，但行程無法跨佇列移動，彈性較差 |\n| **Multilevel Feedback Queue (MLFQ)** | 搶占 | 允許行程依 CPU 使用行為在多層佇列間升降級（短 Burst 留高層、長 Burst 下沉、久候升級） | 兼顧互動回應、短任務優先與防飢餓，是最通用但參數調校最複雜的演算法 |\n\n---\n\n## 三、執行緒與多處理器排程（Multicore / NUMA / HMP）\n\n1. **Contention Scope**：Many-to-One / Many-to-Many 模型由執行緒函式庫於行程內競爭 LWP，稱 **PCS**（`PTHREAD_SCOPE_PROCESS`）；One-to-One 系統（Linux、Windows、macOS）僅支援全系統核心執行緒競爭，稱 **SCS**（`PTHREAD_SCOPE_SYSTEM`）。\n2. **多核與 SMT（Hyper-Threading / CMT）**：\n   - 處理器等待主記憶體時會發生 **Memory Stall**（可佔高達 50% 時間）。硬體透過單核多硬體執行緒（SMT）在 Stall 時切換執行另一執行緒，形成兩層排程：OS 將軟體執行緒排入邏輯 CPU，核心硬體再決定執行哪個硬體執行緒。\n3. **負載平衡 vs. 處理器親和性（Processor Affinity）**：\n   - 現代 SMP 多採每核心私有 Run Queue，並透過 **Push Migration** 與 **Pull Migration** 平衡負載。\n   - **Processor Affinity** 盡量讓執行緒留在同一核心以重用 **Warm Cache**（Soft Affinity vs. Hard Affinity 如 Linux `sched_setaffinity()`）。在 **NUMA** 架構下，跨節點遷移還會導致遠端記憶體存取延遲，因此負載平衡與親和性之間存在天然張力。\n4. **異質多處理（HMP, Heterogeneous Multiprocessing）**：如 ARM **big.LITTLE** 架構，將高效能 `big` 核心與省電 `LITTLE` 核心結合，依任務互動性或省電需求分派核心。\n\n---\n\n## 四、即時系統排程（Real-Time Scheduling）\n\n- **Soft vs. Hard Real-Time**：Soft 僅保證即時行程優先於一般行程；Hard 必須嚴格在 **Deadline** 前完成（逾時視同失敗），需控制 **Event Latency**（= Interrupt Latency + Dispatch Latency）有明確上界，並搭配 **Admission Control**。\n- **Rate-Monotonic (RM)**：針對週期性任務（$0 \\le t \\le d \\le p$）採靜態優先權，週期越短優先權越高。雖為靜態優先權演算法中的最佳解，但有最差 CPU 利用率上限 $N(2^{1/N} - 1)$（$N \\to \\infty$ 時約 **69%**）。\n- **Earliest-Deadline-First (EDF)**：動態依截止時間指派優先權（越早越優先），不限週期性任務，理論 CPU 利用率可達 **100%**。\n- **Proportional Share**：分配總份額 $T$ 中的 $N/T$ 比例，搭配 Admission Control 確保份額足夠。\n\n---\n\n## 五、真實作業系統排程器實作案例\n\n1. **Linux CFS（Completely Fair Scheduler）**：\n   - 取代早期 $O(1)$ 排程器以改善互動回應。Real-Time 任務（`SCHED_FIFO`、`SCHED_RR`）使用靜態優先權 $0 \\sim 99$；一般任務使用 `nice` 值（$-20 \\sim +19$）對應全域優先權 $100 \\sim 139$。\n   - 不使用固定時間切片，而是設定 **Targeted Latency** 並追蹤每個任務的虛擬執行時間 `vruntime`（高優先權衰減較慢，I/O-bound 任務因常阻塞而 `vruntime` 較小，自然優先搶占）。\n   - 所有可執行任務依 `vruntime` 存入 **Red-Black Tree**，並快取最左節點 `rb_leftmost` 以 $O(1)$ 取得下一個執行任務。負載平衡則依 **Scheduling Domains**（L2 共用 → L3/NUMA 節點）由底層向上進行，系統忙碌時避免跨 NUMA 節點遷移。\n2. **Windows Scheduling**：\n   - 32 級搶占式優先權（Variable 1–15、Real-Time 16–31），結合 6 種 Process Priority Class 與 7 種 Relative Priority。\n   - 特色規則：前景視窗程式 Time Quantum ×3；I/O 等待結束時動態提升優先權（鍵盤 I/O 提升幅度大於磁碟）；支援 **UMS（User-Mode Scheduling）** 與 **SMT Sets / Ideal Processor** 種子輪替分散負載。\n3. **Solaris Scheduling**：\n   - 6 種排程類別（TS, IA, RT, SYS, FSS, FP）映射至全域優先權 0–169（160–169 為中斷執行緒）。TS/IA 採用「優先權越高、Time Quantum 越短」的反向 Dispatch Table。\n\n---\n\n## 六、演算法評估方法\n\n- **Deterministic Modeling**（固定工作負載精確計算，適合教學與比較範例）\n- **Queueing Models**（排隊網路分析，**Little's Formula**：$n = \\lambda \\times W$，但受限於數學假設）\n- **Simulations**（亂數分布或錄製真實系統 **Trace Files** 驅動模擬）\n- **Implementation**（實際編寫進核心並於真實環境與 **Regression Testing** 驗證）\n\n## 七、關聯頁面\n- **同軌來源出處**：[Operating System Concepts (10th Ed.) Ch.1–5 來源筆記](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)\n- **同軌相關概念**：[行程管理與行程間通訊（IPC）](#deck/concepts/book/Processes-and-IPC)、[執行緒、平行運算與隱式多工](#deck/concepts/book/Threads-and-Concurrency)", "rawContent": "# CPU 排程演算法與多核／即時排程\n\n## 一、排程基礎與評估準則\n\n根據 [[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5|Operating System Concepts (Ch.5)]]，現代作業系統排程的實際對象是 **Kernel-Level Threads**。\n\n- **CPU–I/O Burst Cycle**：行程執行在 CPU Burst 與 I/O Wait 之間交替；實測顯示 CPU Burst 呈指數分布（大量短 Burst、少數長 Burst）。\n- **Preemptive（搶占式）vs. Nonpreemptive（非搶占式）**：當排程僅在行程「主動等待 I/O」或「終止」時發生，稱為 Nonpreemptive；若允許於「中斷返回」或「I/O 完成喚醒」時切換 CPU，則為 Preemptive。現代 OS 核心本身亦多為搶占式（需以 Mutex 等機制保護核心共享資料）。\n- **Dispatcher**：負責執行 Context Switch、切換至 User Mode 並跳轉回使用者程式位置；其耗時稱為 **Dispatch Latency**。\n- **五大評估準則**：最大化 **CPU Utilization**（實務目標 40%–90%）與 **Throughput**；最小化 **Turnaround Time**、**Waiting Time** 與 **Response Time**（互動式系統尤重降低回應時間變異數）。\n\n---\n\n## 二、經典單核排程演算法比較\n\n| 演算法 | 搶占性 | 核心策略與特性 | 主要優缺點 |\n| :--- | :--- | :--- | :--- |\n| **FCFS** | 非搶占 | 依請求順序以 FIFO 佇列服務 | 實作最簡，但長行程會阻塞後方短行程，造成 **Convoy Effect** |\n| **SJF / SRTF** | 非搶占 / 搶占 | 依下一次 CPU Burst 長度由短到長排程（搶占版稱 SRTF） | 理論上具備**最小平均等待時間**；實務無法預知未來長度，需以指數平均 $\\tau_{n+1} = \\alpha t_n + (1-\\alpha)\\tau_n$ 預測 |\n| **Round-Robin (RR)** | 搶占 | 每個行程最多執行一個 Time Quantum $q$（10–100 ms）後排回佇列尾端 | 公平且回應佳；$q$ 過大退化為 FCFS，過小 Context Switch 開銷大（經驗法則：80% CPU burst $< q$） |\n| **Priority** | 兩者皆可 | 依靜態或動態優先權排程 | 可能導致低優先權行程 **Starvation（飢餓）**，需搭配 **Aging**（隨等待時間提升優先權）解決 |\n| **Multilevel Queue** | 依佇列設計 | 依行程類型（即時、系統、互動、批次）分入固定佇列，各自套用演算法 | 排程開銷低，但行程無法跨佇列移動，彈性較差 |\n| **Multilevel Feedback Queue (MLFQ)** | 搶占 | 允許行程依 CPU 使用行為在多層佇列間升降級（短 Burst 留高層、長 Burst 下沉、久候升級） | 兼顧互動回應、短任務優先與防飢餓，是最通用但參數調校最複雜的演算法 |\n\n---\n\n## 三、執行緒與多處理器排程（Multicore / NUMA / HMP）\n\n1. **Contention Scope**：Many-to-One / Many-to-Many 模型由執行緒函式庫於行程內競爭 LWP，稱 **PCS**（`PTHREAD_SCOPE_PROCESS`）；One-to-One 系統（Linux、Windows、macOS）僅支援全系統核心執行緒競爭，稱 **SCS**（`PTHREAD_SCOPE_SYSTEM`）。\n2. **多核與 SMT（Hyper-Threading / CMT）**：\n   - 處理器等待主記憶體時會發生 **Memory Stall**（可佔高達 50% 時間）。硬體透過單核多硬體執行緒（SMT）在 Stall 時切換執行另一執行緒，形成兩層排程：OS 將軟體執行緒排入邏輯 CPU，核心硬體再決定執行哪個硬體執行緒。\n3. **負載平衡 vs. 處理器親和性（Processor Affinity）**：\n   - 現代 SMP 多採每核心私有 Run Queue，並透過 **Push Migration** 與 **Pull Migration** 平衡負載。\n   - **Processor Affinity** 盡量讓執行緒留在同一核心以重用 **Warm Cache**（Soft Affinity vs. Hard Affinity 如 Linux `sched_setaffinity()`）。在 **NUMA** 架構下，跨節點遷移還會導致遠端記憶體存取延遲，因此負載平衡與親和性之間存在天然張力。\n4. **異質多處理（HMP, Heterogeneous Multiprocessing）**：如 ARM **big.LITTLE** 架構，將高效能 `big` 核心與省電 `LITTLE` 核心結合，依任務互動性或省電需求分派核心。\n\n---\n\n## 四、即時系統排程（Real-Time Scheduling）\n\n- **Soft vs. Hard Real-Time**：Soft 僅保證即時行程優先於一般行程；Hard 必須嚴格在 **Deadline** 前完成（逾時視同失敗），需控制 **Event Latency**（= Interrupt Latency + Dispatch Latency）有明確上界，並搭配 **Admission Control**。\n- **Rate-Monotonic (RM)**：針對週期性任務（$0 \\le t \\le d \\le p$）採靜態優先權，週期越短優先權越高。雖為靜態優先權演算法中的最佳解，但有最差 CPU 利用率上限 $N(2^{1/N} - 1)$（$N \\to \\infty$ 時約 **69%**）。\n- **Earliest-Deadline-First (EDF)**：動態依截止時間指派優先權（越早越優先），不限週期性任務，理論 CPU 利用率可達 **100%**。\n- **Proportional Share**：分配總份額 $T$ 中的 $N/T$ 比例，搭配 Admission Control 確保份額足夠。\n\n---\n\n## 五、真實作業系統排程器實作案例\n\n1. **Linux CFS（Completely Fair Scheduler）**：\n   - 取代早期 $O(1)$ 排程器以改善互動回應。Real-Time 任務（`SCHED_FIFO`、`SCHED_RR`）使用靜態優先權 $0 \\sim 99$；一般任務使用 `nice` 值（$-20 \\sim +19$）對應全域優先權 $100 \\sim 139$。\n   - 不使用固定時間切片，而是設定 **Targeted Latency** 並追蹤每個任務的虛擬執行時間 `vruntime`（高優先權衰減較慢，I/O-bound 任務因常阻塞而 `vruntime` 較小，自然優先搶占）。\n   - 所有可執行任務依 `vruntime` 存入 **Red-Black Tree**，並快取最左節點 `rb_leftmost` 以 $O(1)$ 取得下一個執行任務。負載平衡則依 **Scheduling Domains**（L2 共用 → L3/NUMA 節點）由底層向上進行，系統忙碌時避免跨 NUMA 節點遷移。\n2. **Windows Scheduling**：\n   - 32 級搶占式優先權（Variable 1–15、Real-Time 16–31），結合 6 種 Process Priority Class 與 7 種 Relative Priority。\n   - 特色規則：前景視窗程式 Time Quantum ×3；I/O 等待結束時動態提升優先權（鍵盤 I/O 提升幅度大於磁碟）；支援 **UMS（User-Mode Scheduling）** 與 **SMT Sets / Ideal Processor** 種子輪替分散負載。\n3. **Solaris Scheduling**：\n   - 6 種排程類別（TS, IA, RT, SYS, FSS, FP）映射至全域優先權 0–169（160–169 為中斷執行緒）。TS/IA 採用「優先權越高、Time Quantum 越短」的反向 Dispatch Table。\n\n---\n\n## 六、演算法評估方法\n\n- **Deterministic Modeling**（固定工作負載精確計算，適合教學與比較範例）\n- **Queueing Models**（排隊網路分析，**Little's Formula**：$n = \\lambda \\times W$，但受限於數學假設）\n- **Simulations**（亂數分布或錄製真實系統 **Trace Files** 驅動模擬）\n- **Implementation**（實際編寫進核心並於真實環境與 **Regression Testing** 驗證）\n\n## 七、關聯頁面\n- **同軌來源出處**：[[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5]]\n- **同軌相關概念**：[[concepts/book/Processes-and-IPC]]、[[concepts/book/Threads-and-Concurrency]]", "slides": [{"index": 0, "kind": "cover", "title": "CPU 排程演算法與多核／即時排程", "markdown": ""}, {"index": 1, "kind": "content", "title": "一、排程基礎與評估準則", "markdown": "## 一、排程基礎與評估準則\n\n根據 [Operating System Concepts (Ch.5)](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)，現代作業系統排程的實際對象是 **Kernel-Level Threads**。\n\n- **CPU–I/O Burst Cycle**：行程執行在 CPU Burst 與 I/O Wait 之間交替；實測顯示 CPU Burst 呈指數分布（大量短 Burst、少數長 Burst）。\n- **Preemptive（搶占式）vs. Nonpreemptive（非搶占式）**：當排程僅在行程「主動等待 I/O」或「終止」時發生，稱為 Nonpreemptive；若允許於「中斷返回」或「I/O 完成喚醒」時切換 CPU，則為 Preemptive。現代 OS 核心本身亦多為搶占式（需以 Mutex 等機制保護核心共享資料）。\n- **Dispatcher**：負責執行 Context Switch、切換至 User Mode 並跳轉回使用者程式位置；其耗時稱為 **Dispatch Latency**。\n- **五大評估準則**：最大化 **CPU Utilization**（實務目標 40%–90%）與 **Throughput**；最小化 **Turnaround Time**、**Waiting Time** 與 **Response Time**（互動式系統尤重降低回應時間變異數）。"}, {"index": 2, "kind": "content", "title": "二、經典單核排程演算法比較", "markdown": "## 二、經典單核排程演算法比較\n\n| 演算法 | 搶占性 | 核心策略與特性 | 主要優缺點 |\n| :--- | :--- | :--- | :--- |\n| **FCFS** | 非搶占 | 依請求順序以 FIFO 佇列服務 | 實作最簡，但長行程會阻塞後方短行程，造成 **Convoy Effect** |\n| **SJF / SRTF** | 非搶占 / 搶占 | 依下一次 CPU Burst 長度由短到長排程（搶占版稱 SRTF） | 理論上具備**最小平均等待時間**；實務無法預知未來長度，需以指數平均 $\\tau_{n+1} = \\alpha t_n + (1-\\alpha)\\tau_n$ 預測 |\n| **Round-Robin (RR)** | 搶占 | 每個行程最多執行一個 Time Quantum $q$（10–100 ms）後排回佇列尾端 | 公平且回應佳；$q$ 過大退化為 FCFS，過小 Context Switch 開銷大（經驗法則：80% CPU burst $< q$） |\n| **Priority** | 兩者皆可 | 依靜態或動態優先權排程 | 可能導致低優先權行程 **Starvation（飢餓）**，需搭配 **Aging**（隨等待時間提升優先權）解決 |\n| **Multilevel Queue** | 依佇列設計 | 依行程類型（即時、系統、互動、批次）分入固定佇列，各自套用演算法 | 排程開銷低，但行程無法跨佇列移動，彈性較差 |\n| **Multilevel Feedback Queue (MLFQ)** | 搶占 | 允許行程依 CPU 使用行為在多層佇列間升降級（短 Burst 留高層、長 Burst 下沉、久候升級） | 兼顧互動回應、短任務優先與防飢餓，是最通用但參數調校最複雜的演算法 |"}, {"index": 3, "kind": "content", "title": "三、執行緒與多處理器排程（Multicore / NUMA / HMP）", "markdown": "## 三、執行緒與多處理器排程（Multicore / NUMA / HMP）\n\n1. **Contention Scope**：Many-to-One / Many-to-Many 模型由執行緒函式庫於行程內競爭 LWP，稱 **PCS**（`PTHREAD_SCOPE_PROCESS`）；One-to-One 系統（Linux、Windows、macOS）僅支援全系統核心執行緒競爭，稱 **SCS**（`PTHREAD_SCOPE_SYSTEM`）。\n2. **多核與 SMT（Hyper-Threading / CMT）**：\n   - 處理器等待主記憶體時會發生 **Memory Stall**（可佔高達 50% 時間）。硬體透過單核多硬體執行緒（SMT）在 Stall 時切換執行另一執行緒，形成兩層排程：OS 將軟體執行緒排入邏輯 CPU，核心硬體再決定執行哪個硬體執行緒。\n3. **負載平衡 vs. 處理器親和性（Processor Affinity）**：\n   - 現代 SMP 多採每核心私有 Run Queue，並透過 **Push Migration** 與 **Pull Migration** 平衡負載。\n   - **Processor Affinity** 盡量讓執行緒留在同一核心以重用 **Warm Cache**（Soft Affinity vs. Hard Affinity 如 Linux `sched_setaffinity()`）。在 **NUMA** 架構下，跨節點遷移還會導致遠端記憶體存取延遲，因此負載平衡與親和性之間存在天然張力。\n4. **異質多處理（HMP, Heterogeneous Multiprocessing）**：如 ARM **big.LITTLE** 架構，將高效能 `big` 核心與省電 `LITTLE` 核心結合，依任務互動性或省電需求分派核心。"}, {"index": 4, "kind": "content", "title": "四、即時系統排程（Real-Time Scheduling）", "markdown": "## 四、即時系統排程（Real-Time Scheduling）\n\n- **Soft vs. Hard Real-Time**：Soft 僅保證即時行程優先於一般行程；Hard 必須嚴格在 **Deadline** 前完成（逾時視同失敗），需控制 **Event Latency**（= Interrupt Latency + Dispatch Latency）有明確上界，並搭配 **Admission Control**。\n- **Rate-Monotonic (RM)**：針對週期性任務（$0 \\le t \\le d \\le p$）採靜態優先權，週期越短優先權越高。雖為靜態優先權演算法中的最佳解，但有最差 CPU 利用率上限 $N(2^{1/N} - 1)$（$N \\to \\infty$ 時約 **69%**）。\n- **Earliest-Deadline-First (EDF)**：動態依截止時間指派優先權（越早越優先），不限週期性任務，理論 CPU 利用率可達 **100%**。\n- **Proportional Share**：分配總份額 $T$ 中的 $N/T$ 比例，搭配 Admission Control 確保份額足夠。"}, {"index": 5, "kind": "content", "title": "五、真實作業系統排程器實作案例", "markdown": "## 五、真實作業系統排程器實作案例\n\n1. **Linux CFS（Completely Fair Scheduler）**：\n   - 取代早期 $O(1)$ 排程器以改善互動回應。Real-Time 任務（`SCHED_FIFO`、`SCHED_RR`）使用靜態優先權 $0 \\sim 99$；一般任務使用 `nice` 值（$-20 \\sim +19$）對應全域優先權 $100 \\sim 139$。\n   - 不使用固定時間切片，而是設定 **Targeted Latency** 並追蹤每個任務的虛擬執行時間 `vruntime`（高優先權衰減較慢，I/O-bound 任務因常阻塞而 `vruntime` 較小，自然優先搶占）。\n   - 所有可執行任務依 `vruntime` 存入 **Red-Black Tree**，並快取最左節點 `rb_leftmost` 以 $O(1)$ 取得下一個執行任務。負載平衡則依 **Scheduling Domains**（L2 共用 → L3/NUMA 節點）由底層向上進行，系統忙碌時避免跨 NUMA 節點遷移。\n2. **Windows Scheduling**：\n   - 32 級搶占式優先權（Variable 1–15、Real-Time 16–31），結合 6 種 Process Priority Class 與 7 種 Relative Priority。\n   - 特色規則：前景視窗程式 Time Quantum ×3；I/O 等待結束時動態提升優先權（鍵盤 I/O 提升幅度大於磁碟）；支援 **UMS（User-Mode Scheduling）** 與 **SMT Sets / Ideal Processor** 種子輪替分散負載。\n3. **Solaris Scheduling**：\n   - 6 種排程類別（TS, IA, RT, SYS, FSS, FP）映射至全域優先權 0–169（160–169 為中斷執行緒）。TS/IA 採用「優先權越高、Time Quantum 越短」的反向 Dispatch Table。"}, {"index": 6, "kind": "content", "title": "六、演算法評估方法", "markdown": "## 六、演算法評估方法\n\n- **Deterministic Modeling**（固定工作負載精確計算，適合教學與比較範例）\n- **Queueing Models**（排隊網路分析，**Little's Formula**：$n = \\lambda \\times W$，但受限於數學假設）\n- **Simulations**（亂數分布或錄製真實系統 **Trace Files** 驅動模擬）\n- **Implementation**（實際編寫進核心並於真實環境與 **Regression Testing** 驗證）"}, {"index": 7, "kind": "content", "title": "七、關聯頁面", "markdown": "## 七、關聯頁面\n- **同軌來源出處**：[Operating System Concepts (10th Ed.) Ch.1–5 來源筆記](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)\n- **同軌相關概念**：[行程管理與行程間通訊（IPC）](#deck/concepts/book/Processes-and-IPC)、[執行緒、平行運算與隱式多工](#deck/concepts/book/Threads-and-Concurrency)"}], "sourceRefs": [{"slug": "sources/book/2018-Silberschatz-OS-Concepts-Ch1-5", "label": "Operating System Concepts (10th Ed.) Ch.1–5 來源筆記"}], "backlinks": [{"slug": "concepts/book/Processes-and-IPC", "label": "行程管理與行程間通訊（IPC）"}, {"slug": "concepts/book/Threads-and-Concurrency", "label": "執行緒、平行運算與隱式多工"}, {"slug": "overview", "label": "課程簡報與原文書知識庫全域總覽"}, {"slug": "sources/book/2018-Silberschatz-OS-Concepts-Ch1-5", "label": "Operating System Concepts (10th Ed.) Ch.1–5 來源筆記"}]}, {"slug": "concepts/book/OS-Architecture-and-System-Calls", "frontmatter": {"title": "作業系統架構、系統呼叫與核心除錯", "type": "concept", "source_type": "book", "tags": ["course-notes", "book", "operating-systems", "architecture", "system-calls", "kernel"], "created": "2026-11-16", "updated": "2026-11-16", "sources": ["[[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5]]"], "status": "growing", "authors": "", "raw_file": ""}, "content": "# 作業系統架構、系統呼叫與核心除錯\n\n## 一、硬體組織、中斷與儲存階層\n\n根據 [Operating System Concepts (Ch.1–2)](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)，作業系統作為硬體與應用程式之間的中介層，其運作建立在三個核心硬體機制上：\n\n1. **中斷驅動（Interrupt-Driven I/O）與 DMA**：\n   - 硬體透過系統匯流排發送訊號至 CPU 的 Interrupt-Request Line，CPU 透過 **Interrupt Vector**（中斷向量表）跳轉至對應的 Interrupt Service Routine (ISR) 並保存暫存器狀態。\n   - 現代 CPU 區分 **Maskable**（可遮罩，供裝置請求）與 **Nonmaskable**（不可遮罩，如嚴重記憶體錯誤），並透過 **Interrupt Chaining** 與優先權分級處理多裝置事件。\n   - 大量資料傳輸（如磁碟 I/O）採用 **DMA（Direct Memory Access）**，由裝置控制器直接將整個資料區塊搬移至主記憶體，每個區塊僅產生一次中斷，大幅降低 CPU 介入成本。\n2. **儲存階層（Storage-Device Hierarchy）**：\n   - 由快到慢、由小到大依序為：Registers → Cache (SRAM) → Main Memory (DRAM，揮發性) → Nonvolatile Memory (NVM，如 Flash/SSD) → Hard-Disk Drives (HDD，機械式) → Optical Disk / Magnetic Tapes（Tertiary Storage）。\n   - **快取一致性（Cache Coherency）**：在多處理器系統中，同一資料可能同時存在於多個 CPU 的本地快取中，必須確保一處更新立即反映於其他快取（通常由硬體層處理）。\n3. **雙重模式與多模式保護（Dual-Mode Operation）**：\n   - 硬體提供 `mode bit` 區分 **Kernel Mode (`0`)** 與 **User Mode (`1`)**。唯有核心模式可執行 **Privileged Instructions**（如切換模式、I/O 控制、修改計時器與中斷管理）。\n   - 若使用者程式在 User Mode 嘗試執行特權指令，硬體會將其視為非法並觸發 **Trap** 交由作業系統終止。現代架構更延伸出多層級模式（如 Intel 4 個 Protection Rings、ARMv8 7 種模式，以及支援虛擬化的 **VMM Mode**）。\n\n---\n\n## 二、系統呼叫（System Calls）、API 與 ABI\n\n1. **API 與 System-Call Interface 的分層**：\n   - 開發者通常不直接呼叫底層系統呼叫，而是透過高階 **API**（如 POSIX `libc`、Windows API、Java API）提升程式可攜性。\n   - 當程式呼叫 API（例如 `open()` 或 `printf()`）時，**Run-Time Environment (RTE)** 中的 **System-Call Interface** 會攔截該呼叫，依系統呼叫編號查表並觸發 Trap 進入核心模式執行（例如 Windows `CreateProcess()` 對應核心 `NTCreateProcess()`）。\n2. **參數傳遞的三種方式**：\n   - 透過 CPU 暫存器直接傳遞（Linux 在參數 $\\le 5$ 個時採用）。\n   - 將參數存於記憶體區塊（Block/Table），僅把區塊位址透過暫存器傳入（Linux $> 5$ 個參數時採用）。\n   - 推入 Stack 後由作業系統彈出（無數量與長度限制）。\n3. **跨平台障礙與 ABI**：\n   - 編譯後的執行檔具有作業系統與 CPU 相依性，原因包括：不同的可執行檔格式（Linux/UNIX 的 **ELF**、Windows 的 **PE**、macOS 的 **Mach-O**）、不同的 CPU 指令集（ISA），以及相異的系統呼叫慣例。\n   - **ABI（Application Binary Interface）** 定義了特定架構與作業系統下的二進位介面標準（位址寬度、系統呼叫傳參方式、資料型別大小等），相當於架構層級的 API。\n\n---\n\n## 三、作業系統核心架構演進\n\n| 架構類型 | 核心設計方式 | 代表系統 | 優點 | 缺點 |\n| :--- | :--- | :--- | :--- | :--- |\n| **Monolithic（單體式）** | 所有核心功能置於單一靜態二進位檔與單一位址空間 | 傳統 UNIX、Linux | 系統呼叫與核心內部通訊極快、開銷極低 | 緊耦合，修改與擴充難度高 |\n| **Layered（分層式）** | 嚴格分層（Layer 0 為硬體，Layer $N$ 為 UI），每層僅能呼叫下層 | 網路協定堆疊 (TCP/IP) | 建構與除錯簡單（逐層驗證） | 請求需穿越多層導致效能差、層級職責難以切分 |\n| **Microkernel（微核心）** | 僅保留最小行程／記憶體管理與通訊機制，其餘移至 User Space | CMU Mach、QNX Neutrino | 高度模組化、易移植；單一服務崩潰不影響核心 | User Space 服務間需透過 Message Passing 複製訊息與切換行程，效能開銷大 |\n| **Loadable Kernel Modules (LKMs)** | 核心僅含基礎元件，驅動程式與檔案系統於開機或執行期動態載入 | Linux、Solaris、macOS (`kexts`) | 兼具單體式的高效能與模組化的動態彈性，免重編譯核心 | 模組仍於核心空間執行，錯誤可能影響核心穩定性 |\n| **Hybrid（混合式）** | 結合單體式效能、微核心抽象與動態模組 | macOS/iOS (Darwin)、Windows 10、Android | 兼顧效能、安全性與系統擴充性 | 整體架構複雜度較高 |\n\n### 代表性混合架構細節\n- **macOS / iOS (Darwin)**：由 Mach 微核心與 BSD UNIX 核心共同組成，並整合 I/O Kit 與 `kexts`。為解決純 Mach 的訊息複製效能瓶頸，Darwin 將 Mach、BSD 與 I/O Kit 放入**單一位址空間**，使訊息傳遞不需複製資料；對外提供 Mach Traps 與 BSD (POSIX) 雙重系統呼叫介面。\n- **Android**：以修改後的 Linux Kernel 為底層（加入電源管理與 **Binder** IPC），向上依序為 **Bionic** 精簡 C 函式庫（體積小且避開 glibc 的 GPL 授權）、**HAL（Hardware Abstraction Layer）**、Native Libraries（SQLite, SSL, WebKit）、**ART（Android RunTime）**（安裝時以 AOT 提前編譯 `.dex` 為原生機器碼以省電提速），以及 Java 應用框架。\n- **Windows Subsystem for Linux (WSL)**：於 Windows 10 混合架構中透過 **Pico Processes** 執行原生 Linux ELF 二進位檔，並由核心服務 `LXCore` / `LXSS` 將 Linux 系統呼叫（如 `fork()`）即時轉譯或對應至 Windows 原生呼叫（如 `CreateProcess()`）。\n\n---\n\n## 四、系統啟動與核心動態追蹤（BCC / eBPF）\n\n- **啟動流程（Booting）**：BIOS（多階段載入 Boot Block）或 UEFI（單一完整啟動管理員）→ Boot Loader（如 Linux **GRUB**）載入壓縮核心與暫時記憶體檔案系統 `initramfs` → 載入驅動並切換至真實 Root File System → 啟動初始行程 `systemd`（Android 則由 **LK** 載入並永久保留 `initramfs` 作為根檔案系統）。\n- **核心追蹤與 BCC / eBPF**：傳統 `strace`/`perf`/`tcpdump` 或 `/proc` 計數器難以在不影響線上系統下同時觀測 User 與 Kernel 互動。Linux **eBPF** 允許將受限 C 語言編譯為位元組碼，經核心 **Verifier** 確認安全與不影響效能後，透過 Probes/Tracepoints 動態插入運行中的核心；**BCC** 提供 Python 前端包裝（如 `disksnoop.py`、`opensnoop`），實現低開銷的生產環境即時除錯。\n\n## 五、關聯頁面\n- **同軌來源出處**：[Operating System Concepts (10th Ed.) Ch.1–5 來源筆記](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)\n- **同軌相關概念**：[行程管理與行程間通訊（IPC）](#deck/concepts/book/Processes-and-IPC)、[執行緒、平行運算與隱式多工](#deck/concepts/book/Threads-and-Concurrency)", "rawContent": "# 作業系統架構、系統呼叫與核心除錯\n\n## 一、硬體組織、中斷與儲存階層\n\n根據 [[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5|Operating System Concepts (Ch.1–2)]]，作業系統作為硬體與應用程式之間的中介層，其運作建立在三個核心硬體機制上：\n\n1. **中斷驅動（Interrupt-Driven I/O）與 DMA**：\n   - 硬體透過系統匯流排發送訊號至 CPU 的 Interrupt-Request Line，CPU 透過 **Interrupt Vector**（中斷向量表）跳轉至對應的 Interrupt Service Routine (ISR) 並保存暫存器狀態。\n   - 現代 CPU 區分 **Maskable**（可遮罩，供裝置請求）與 **Nonmaskable**（不可遮罩，如嚴重記憶體錯誤），並透過 **Interrupt Chaining** 與優先權分級處理多裝置事件。\n   - 大量資料傳輸（如磁碟 I/O）採用 **DMA（Direct Memory Access）**，由裝置控制器直接將整個資料區塊搬移至主記憶體，每個區塊僅產生一次中斷，大幅降低 CPU 介入成本。\n2. **儲存階層（Storage-Device Hierarchy）**：\n   - 由快到慢、由小到大依序為：Registers → Cache (SRAM) → Main Memory (DRAM，揮發性) → Nonvolatile Memory (NVM，如 Flash/SSD) → Hard-Disk Drives (HDD，機械式) → Optical Disk / Magnetic Tapes（Tertiary Storage）。\n   - **快取一致性（Cache Coherency）**：在多處理器系統中，同一資料可能同時存在於多個 CPU 的本地快取中，必須確保一處更新立 in 將 Mach、BSD 與 I/O Kit 放入**單一位址空間**，使訊息傳遞不需複製資料；對外提供 Mach Traps 與 BSD (POSIX) 雙重系統呼叫介面。\n- **Android**：以修改後的 Linux Kernel 為底層（加入電源管理與 **Binder** IPC），向上依序為 **Bionic** 精簡 C 函式庫（體積小且避開 glibc 的 GPL 授權）、**HAL（Hardware Abstraction Layer）**、Native Libraries（SQLite, SSL, WebKit）、**ART（Android RunTime）**（安裝時以 AOT 提前編譯 `.dex` 為原生機器碼以省電提速），以及 Java 應用框架。\n- **Windows Subsystem for Linux (WSL)**：於 Windows 10 混合架構中透過 **Pico Processes** 執行原生 Linux ELF 二進位檔，並由核心服務 `LXCore` / `LXSS` 將 Linux 系統呼叫（如 `fork()`）即時轉譯或對應至 Windows 原生呼叫（如 `CreateProcess()`）。\n\n---\n\n## 四、系統啟動與核心動態追蹤（BCC / eBPF）\n\n- **啟動流程（Booting）**：BIOS（多階段載入 Boot Block）或 UEFI（單一完整啟動管理員）→ Boot Loader（如 Linux **GRUB**）載入壓縮核心與暫時記憶體檔案系統 `initramfs` → 載入驅動並切換至真實 Root File System → 啟動初始行程 `systemd`（Android 則由 **LK** 載入並永久保留 `initramfs` 作為根檔案系統）。\n- **核心追蹤與 BCC / eBPF**：傳統 `strace`/`perf`/`tcpdump` 或 `/proc` 計數器難以在不影響線上系統下同時觀測 User 與 Kernel 互動。Linux **eBPF** 允許將受限 C 語言編譯為位元組碼，經核心 **Verifier** 確認安全與不影響效能後，透過 Probes/Tracepoints 動態插入運行中的核心；**BCC** 提供 Python 前端包裝（如 `disksnoop.py`、`opensnoop`），實現低開銷的生產環境即時除錯。\n\n## 五、關聯頁面\n- **同軌來源出處**：[[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5]]\n- **同軌相關概念**：[[concepts/book/Processes-and-IPC]]、[[concepts/book/Threads-and-Concurrency]]", "slides": [{"index": 0, "kind": "cover", "title": "作業系統架構、系統呼叫與核心除錯", "markdown": ""}, {"index": 1, "kind": "content", "title": "一、硬體組織、中斷與儲存階層", "markdown": "## 一、硬體組織、中斷與儲存階層\n\n根據 [Operating System Concepts (Ch.1–2)](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)，作業系統作為硬體與應用程式之間的中介層，其運作建立在三個核心硬體機制上：\n\n1. **中斷驅動（Interrupt-Driven I/O）與 DMA**：\n   - 硬體透過系統匯流排發送訊號至 CPU 的 Interrupt-Request Line，CPU 透過 **Interrupt Vector**（中斷向量表）跳轉至對應的 Interrupt Service Routine (ISR) 並保存暫存器狀態。\n   - 現代 CPU 區分 **Maskable**（可遮罩，供裝置請求）與 **Nonmaskable**（不可遮罩，如嚴重記憶體錯誤），並透過 **Interrupt Chaining** 與優先權分級處理多裝置事件。\n   - 大量資料傳輸（如磁碟 I/O）採用 **DMA（Direct Memory Access）**，由裝置控制器直接將整個資料區塊搬移至主記憶體，每個區塊僅產生一次中斷，大幅降低 CPU 介入成本。\n2. **儲存階層（Storage-Device Hierarchy）**：\n   - 由快到慢、由小到大依序為：Registers → Cache (SRAM) → Main Memory (DRAM，揮發性) → Nonvolatile Memory (NVM，如 Flash/SSD) → Hard-Disk Drives (HDD，機械式) → Optical Disk / Magnetic Tapes（Tertiary Storage）。\n   - **快取一致性（Cache Coherency）**：在多處理器系統中，同一資料可能同時存在於多個 CPU 的本地快取中，必須確保一處更新立即反映於其他快取（通常由硬體層處理）。\n3. **雙重模式與多模式保護（Dual-Mode Operation）**：\n   - 硬體提供 `mode bit` 區分 **Kernel Mode (`0`)** 與 **User Mode (`1`)**。唯有核心模式可執行 **Privileged Instructions**（如切換模式、I/O 控制、修改計時器與中斷管理）。\n   - 若使用者程式在 User Mode 嘗試執行特權指令，硬體會將其視為非法並觸發 **Trap** 交由作業系統終止。現代架構更延伸出多層級模式（如 Intel 4 個 Protection Rings、ARMv8 7 種模式，以及支援虛擬化的 **VMM Mode**）。"}, {"index": 2, "kind": "content", "title": "二、系統呼叫（System Calls）、API 與 ABI", "markdown": "## 二、系統呼叫（System Calls）、API 與 ABI\n\n1. **API 與 System-Call Interface 的分層**：\n   - 開發者通常不直接呼叫底層系統呼叫，而是透過高階 **API**（如 POSIX `libc`、Windows API、Java API）提升程式可攜性。\n   - 當程式呼叫 API（例如 `open()` 或 `printf()`）時，**Run-Time Environment (RTE)** 中的 **System-Call Interface** 會攔截該呼叫，依系統呼叫編號查表並觸發 Trap 進入核心模式執行（例如 Windows `CreateProcess()` 對應核心 `NTCreateProcess()`）。\n2. **參數傳遞的三種方式**：\n   - 透過 CPU 暫存器直接傳遞（Linux 在參數 $\\le 5$ 個時採用）。\n   - 將參數存於記憶體區塊（Block/Table），僅把區塊位址透過暫存器傳入（Linux $> 5$ 個參數時採用）。\n   - 推入 Stack 後由作業系統彈出（無數量與長度限制）。\n3. **跨平台障礙與 ABI**：\n   - 編譯後的執行檔具有作業系統與 CPU 相依性，原因包括：不同的可執行檔格式（Linux/UNIX 的 **ELF**、Windows 的 **PE**、macOS 的 **Mach-O**）、不同的 CPU 指令集（ISA），以及相異的系統呼叫慣例。\n   - **ABI（Application Binary Interface）** 定義了特定架構與作業系統下的二進位介面標準（位址寬度、系統呼叫傳參方式、資料型別大小等），相當於架構層級的 API。"}, {"index": 3, "kind": "content", "title": "三、作業系統核心架構演進", "markdown": "## 三、作業系統核心架構演進\n\n| 架構類型 | 核心設計方式 | 代表系統 | 優點 | 缺點 |\n| :--- | :--- | :--- | :--- | :--- |\n| **Monolithic（單體式）** | 所有核心功能置於單一靜態二進位檔與單一位址空間 | 傳統 UNIX、Linux | 系統呼叫與核心內部通訊極快、開銷極低 | 緊耦合，修改與擴充難度高 |\n| **Layered（分層式）** | 嚴格分層（Layer 0 為硬體，Layer $N$ 為 UI），每層僅能呼叫下層 | 網路協定堆疊 (TCP/IP) | 建構與除錯簡單（逐層驗證） | 請求需穿越多層導致效能差、層級職責難以切分 |\n| **Microkernel（微核心）** | 僅保留最小行程／記憶體管理與通訊機制，其餘移至 User Space | CMU Mach、QNX Neutrino | 高度模組化、易移植；單一服務崩潰不影響核心 | User Space 服務間需透過 Message Passing 複製訊息與切換行程，效能開銷大 |\n| **Loadable Kernel Modules (LKMs)** | 核心僅含基礎元件，驅動程式與檔案系統於開機或執行期動態載入 | Linux、Solaris、macOS (`kexts`) | 兼具單體式的高效能與模組化的動態彈性，免重編譯核心 | 模組仍於核心空間執行，錯誤可能影響核心穩定性 |\n| **Hybrid（混合式）** | 結合單體式效能、微核心抽象與動態模組 | macOS/iOS (Darwin)、Windows 10、Android | 兼顧效能、安全性與系統擴充性 | 整體架構複雜度較高 |\n\n### 代表性混合架構細節\n- **macOS / iOS (Darwin)**：由 Mach 微核心與 BSD UNIX 核心共同組成，並整合 I/O Kit 與 `kexts`。為解決純 Mach 的訊息複製效能瓶頸，Darwin 將 Mach、BSD 與 I/O Kit 放入**單一位址空間**，使訊息傳遞不需複製資料；對外提供 Mach Traps 與 BSD (POSIX) 雙重系統呼叫介面。\n- **Android**：以修改後的 Linux Kernel 為底層（加入電源管理與 **Binder** IPC），向上依序為 **Bionic** 精簡 C 函式庫（體積小且避開 glibc 的 GPL 授權）、**HAL（Hardware Abstraction Layer）**、Native Libraries（SQLite, SSL, WebKit）、**ART（Android RunTime）**（安裝時以 AOT 提前編譯 `.dex` 為原生機器碼以省電提速），以及 Java 應用框架。\n- **Windows Subsystem for Linux (WSL)**：於 Windows 10 混合架構中透過 **Pico Processes** 執行原生 Linux ELF 二進位檔，並由核心服務 `LXCore` / `LXSS` 將 Linux 系統呼叫（如 `fork()`）即時轉譯或對應至 Windows 原生呼叫（如 `CreateProcess()`）。"}, {"index": 4, "kind": "content", "title": "四、系統啟動與核心動態追蹤（BCC / eBPF）", "markdown": "## 四、系統啟動與核心動態追蹤（BCC / eBPF）\n\n- **啟動流程（Booting）**：BIOS（多階段載入 Boot Block）或 UEFI（單一完整啟動管理員）→ Boot Loader（如 Linux **GRUB**）載入壓縮核心與暫時記憶體檔案系統 `initramfs` → 載入驅動並切換至真實 Root File System → 啟動初始行程 `systemd`（Android 則由 **LK** 載入並永久保留 `initramfs` 作為根檔案系統）。\n- **核心追蹤與 BCC / eBPF**：傳統 `strace`/`perf`/`tcpdump` 或 `/proc` 計數器難以在不影響線上系統下同時觀測 User 與 Kernel 互動。Linux **eBPF** 允許將受限 C 語言編譯為位元組碼，經核心 **Verifier** 確認安全與不影響效能後，透過 Probes/Tracepoints 動態插入運行中的核心；**BCC** 提供 Python 前端包裝（如 `disksnoop.py`、`opensnoop`），實現低開銷的生產環境即時除錯。"}, {"index": 5, "kind": "content", "title": "五、關聯頁面", "markdown": "## 五、關聯頁面\n- **同軌來源出處**：[Operating System Concepts (10th Ed.) Ch.1–5 來源筆記](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)\n- **同軌相關概念**：[行程管理與行程間通訊（IPC）](#deck/concepts/book/Processes-and-IPC)、[執行緒、平行運算與隱式多工](#deck/concepts/book/Threads-and-Concurrency)"}], "sourceRefs": [{"slug": "sources/book/2018-Silberschatz-OS-Concepts-Ch1-5", "label": "Operating System Concepts (10th Ed.) Ch.1–5 來源筆記"}], "backlinks": [{"slug": "concepts/book/Processes-and-IPC", "label": "行程管理與行程間通訊（IPC）"}, {"slug": "overview", "label": "課程簡報與原文書知識庫全域總覽"}, {"slug": "sources/book/2018-Silberschatz-OS-Concepts-Ch1-5", "label": "Operating System Concepts (10th Ed.) Ch.1–5 來源筆記"}]}, {"slug": "concepts/book/Processes-and-IPC", "frontmatter": {"title": "行程管理與行程間通訊（IPC）", "type": "concept", "source_type": "book", "tags": ["course-notes", "book", "operating-systems", "processes", "ipc", "rpc"], "created": "2026-11-16", "updated": "2026-11-16", "sources": ["[[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5]]"], "status": "growing", "authors": "", "raw_file": ""}, "content": "# 行程管理與行程間通訊（IPC）\n\n## 一、行程（Process）的定義與記憶體配置\n\n根據 [Operating System Concepts (Ch.3)](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)，**Program** 是儲存於磁碟上的被動（Passive）可執行檔，而 **Process** 是載入記憶體執行中的主動（Active）實體。\n\n一個行程在記憶體中的配置分為四個主要區段（另在 C 程式高記憶體區包含 `argc`/`argv`）：\n1. **Text Section**：可執行程式碼（固定大小）。\n2. **Data Section**：全域變數（細分為已初始化的 `data` 與未初始化的 `bss`，固定大小）。\n3. **Heap Section**：執行期動態配置（如 `malloc`）的記憶體，由低位址向高位址動態增長。\n4. **Stack Section**：函式呼叫時的暫存資料（Activation Record：參數、區域變數、返回位址），由高位址向低位址動態增長；作業系統須確保 Stack 與 Heap 不重疊。\n\n### 行程狀態與 PCB（Process Control Block）\n- **五種狀態**：`New` → `Ready` ↔ `Running`（單一核心同時只能有一個行程處於 Running）→ `Waiting`（等待 I/O 或事件）→ `Terminated`。\n- **PCB（Task Control Block）**：儲存重啟行程所需的所有狀態（Process State、Program Counter、CPU Registers、排程參數、記憶體管理資訊、會計統計與 I/O 開啟檔案清單）。在 Linux 核心中，PCB 由 `<include/linux/sched.h>` 的 `struct task_struct` 實作，並以雙向鏈結串列串起所有活躍行程，由 `current` 指標指向當前執行中的行程。\n\n---\n\n## 二、行程排程佇列與上下文切換（Context Switch）\n\n- **佇列流轉**：行程進入系統後置於 **Ready Queue**；等待 I/O 或子行程結束時移入對應的 **Wait Queue**。\n- **Context Switch**：當 CPU 核心切換執行另一行程時，核心必須將舊行程的 CPU 暫存器、狀態與記憶體管理資訊存入其 PCB（State Save），並載入新行程的 PCB 狀態（State Restore）。**Context Switch 是純系統開銷（Pure Overhead）**，耗時數微秒，取決於記憶體速度、暫存器數量（若硬體提供多組暫存器組可僅切換指標）與位址空間保存複雜度。\n\n---\n\n## 三、行程建立、終止與特殊狀態\n\n1. **UNIX/Linux 建立模型（`fork()` + `exec()`）**：\n   - `fork()` 複製父行程位址空間建立子行程；子行程收到回傳值 `0`，父行程收到子行程的 `pid`。\n   - 子行程常接著呼叫 `exec()`（如 `execlp()`）以新程式覆寫自身記憶體空間；父行程可呼叫 `wait()` 阻塞等待子行程結束，或與其並行執行。\n   - **Windows 對比**：`CreateProcess()` 需傳入至少 10 個參數，且在建立當下即直接載入指定的新程式，不複製父行程位址空間；對應 `wait()` 的函式為 `WaitForSingleObject()`。\n2. **終止、殭屍與孤兒行程**：\n   - **Zombie Process（殭屍行程）**：子行程已呼叫 `exit()` 終止並釋放資源，但父行程尚未呼叫 `wait()` 讀取其結束狀態，因此仍佔用 Process Table 項目。\n   - **Orphan Process（孤兒行程）**：父行程未呼叫 `wait()` 即提前終止，導致子行程失去父行程。傳統 UNIX 由 `init`（`pid = 1`）收養並定期 `wait()` 回收；現代 Linux 由 `systemd`（或指定繼承行程）處理。\n3. **Android 行程重要性階層**：因行動裝置記憶體有限，系統回收資源時依序由低到高終止：Empty → Background → Service → Visible → Foreground Process。\n\n---\n\n## 四、行程間通訊（IPC：Interprocess Communication）\n\n協作行程（Cooperating Processes）可透過兩種基本模型交換資料：\n\n| 比較維度 | Shared Memory（共享記憶體） | Message Passing（訊息傳遞） |\n| :--- | :--- | :--- |\n| **核心介入時機** | 僅在「建立」共享區段時需系統呼叫，之後如同一般記憶體存取，**速度極快** | 每次 `send()` / `receive()` 皆透過系統呼叫由核心轉送 |\n| **同步責任** | **應用程式自行負責**避免同時寫入衝突（如 Bounded Buffer 循環陣列） | 由作業系統／通訊鏈結處理，無須處理記憶體衝突 |\n| **適用場景** | 同機大量資料高速交換（如 POSIX `shm_open` + `ftruncate` + `mmap`） | 少量資料交換、**跨機器分散式系統** |\n\n### 訊息傳遞的設計維度\n- **Naming（命名）**：Direct（直接指定對方行程 ID，模組性較差）vs. Indirect（透過共享 **Mailbox / Port**，支援多對多彈性綁定）。\n- **Synchronization（同步）**：Blocking（Synchronous）vs. Nonblocking（Asynchronous）；當 `send()` 與 `receive()` 皆為 Blocking 時稱為 **Rendezvous**。\n- **Buffering（緩衝）**：Zero Capacity（無緩衝，傳送端必阻塞）、Bounded Capacity（有限佇列，滿時阻塞）、Unbounded Capacity（無限佇列，傳送端永不阻塞）。\n\n### 實務 IPC 與 Client–Server 機制\n- **Mach Message Passing**：透過 **Port** 與 **Port Rights** 控制存取權限；為避免同機傳遞大量訊息的複製開銷，Mach 利用虛擬記憶體將傳送端位址空間直接映射給接收端。\n- **Windows ALPC**：同機雙向通道，依訊息大小採三種策略：$\\le 256\\text{ bytes}$ 經由 Port 佇列複製；較大訊息使用共享記憶體 **Section Object**；超大資料則透過 API 直接讀寫客戶端位址空間。\n- **Pipes**：\n  - **Ordinary / Anonymous Pipes**：單向、僅限具父子關係之同機行程（UNIX `pipe(fd)`，`fd[0]` 讀、`fd[1]` 寫；Windows `CreatePipe()` 需顯式設定句柄繼承）。\n  - **Named Pipes**：無須父子關係、可長期存在。UNIX **FIFOs**（`mkfifo()`）僅支援半雙工與同機位元組串流；Windows `CreateNamedPipe()` 支援全雙工、跨網路與訊息導向傳輸。\n- **Sockets & RPC**：\n  - **Sockets**：網路通訊端點（IP + Port，`<1024` 為 Well-known Ports，Loopback `127.0.0.1`），傳送無結構的位元組串流（TCP `Socket` / UDP `DatagramSocket`）。\n  - **RPC（Remote Procedure Calls）**：將跨機訊息包裝為類似本地函式呼叫，透過 Client/Server **Stubs** 與 **Parameter Marshaling**（如 **XDR** 格式解決 Big-Endian 與 Little-Endian 差異）傳遞結構化參數；可透過時間戳記實現 *at-most-once*，加上 ACK 重傳實現 *exactly-once*，並由 Matchmaker（Rendezvous Daemon）進行動態 Port 綁定。\n  - **Android Binder / RPC**：同機行程間亦廣泛使用 RPC，透過 `Service` 的 `onBind()` 與 **AIDL** 自動生成 Stub 處理參數序列化與跨行程呼叫。\n\n## 五、關聯頁面\n- **同軌來源出處**：[Operating System Concepts (10th Ed.) Ch.1–5 來源筆記](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)\n- **同軌相關概念**：[作業系統架構、系統呼叫與核心除錯](#deck/concepts/book/OS-Architecture-and-System-Calls)、[執行緒、平行運算與隱式多工](#deck/concepts/book/Threads-and-Concurrency)、[CPU 排程演算法與多核／即時排程](#deck/concepts/book/CPU-Scheduling)", "rawContent": "# 行程管理與行程間通訊（IPC）\n\n## 一、行程（Process）的定義與記憶體配置\n\n根據 [[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5|Operating System Concepts (Ch.3)]]，**Program** 是儲存於磁碟上的被動（Passive）可執行檔，而 **Process** 是載入記憶體執行中的主動（Active）實體。\n\n一個行程在記憶體中的配置分為四個主要區段（另在 C 程式高記憶體區包含 `argc`/`argv`）：\n1. **Text Section**：可執行程式碼（固定大小）。\n2. **Data Section**：全域變數（細分為已初始化的 `data` 與未初始化的 `bss`，固定大小）。\n3. **Heap Section**：執行期動態配置（如 `malloc`）的記憶體，由低位址向高位址動態增長。\n4. **Stack Section**：函式呼叫時的暫存資料（Activation Record：參數、區域變數、返回位址），由高位址向低位址動態增長；作業系統須確保 Stack 與 Heap 不重疊。\n\n### 行程狀態與 PCB（Process Control Block）\n- **五種狀態**：`New` → `Ready` ↔ `Running`（單一核心同時只能有一個行程處於 Running）→ `Waiting`（等待 I/O 或事件）→ `Terminated`。\n- **PCB（Task Control Block）**：儲存重啟行程所需的所有狀態（Process State、Program Counter、CPU Registers、排程參數、記憶體管理資訊、會計統計與 I/O 開啟檔案清單）。在 Linux 核心中，PCB 由 `<include/linux/sched.h>` 的 `struct task_struct` 實作，並以雙向鏈結串列串起所有活躍行程，由 `current` 指標指向當前執行中的行程。\n\n---\n\n## 二、行程排程佇列與上下文切換（Context Switch）\n\n- **佇列流轉**：行程進入系統後置於 **Ready Queue**；等待 I/O 或子行程結束時移入對應的 **Wait Queue**。\n- **Context Switch**：當 CPU 核心切換執行另一行程時，核心必須將舊行程的 CPU 暫存器、狀態與記憶體管理資訊存入其 PCB（State Save），並載入新行程的 PCB 狀態（State Restore）。**Context Switch 是純系統開銷（Pure Overhead）**，耗時數微秒，取決於記憶體速度、暫存器數量（若硬體提供多組暫存器組可僅切換指標）與位址空間保存複雜度。\n\n---\n\n## 三、行程建立、終止與特殊狀態\n\n1. **UNIX/Linux 建立模型（`fork()` + `exec()`）**：\n   - `fork()` 複製父行程位址空間建立子行程；子行程收到回傳值 `0`，父行程收到子行程的 `pid`。\n   - 子行程常接著呼叫 `exec()`（如 `execlp()`）以新程式覆寫自身記憶體空間；父行程可呼叫 `wait()` 阻塞等待子行程結束，或與其並行執行。\n   - **Windows 對比**：`CreateProcess()` 需傳入至少 10 個參數，且在建立當下即直接載入指定的新程式，不複製父行程位址空間；對應 `wait()` 的函式為 `WaitForSingleObject()`。\n2. **終止、殭屍與孤兒行程**：\n   - **Zombie Process（殭屍行程）**：子行程已呼叫 `exit()` 終止並釋放資源，但父行程尚未呼叫 `wait()` 讀取其結束狀態，因此仍佔用 Process Table 項目。\n   - **Orphan Process（孤兒行程）**：父行程未呼叫 `wait()` 即提前終止，導致子行程失去父行程。傳統 UNIX 由 `init`（`pid = 1`）收養並定期 `wait()` 回收；現代 Linux 由 `systemd`（或指定繼承行程）處理。\n3. **Android 行程重要性階層**：因行動裝置記憶體有限，系統回收資源時依序由低到高終止：Empty → Background → Service → Visible → Foreground Process。\n\n---\n\n## 四、行程間通訊（IPC：Interprocess Communication）\n\n協作行程（Cooperating Processes）可透過兩種基本模型交換資料：\n\n| 比較維度 | Shared Memory（共享記憶體） | Message Passing（訊息傳遞） |\n| :--- | :--- | :--- |\n| **核心介入時機** | 僅在「建立」共享區段時需系統呼叫，之後如同一般記憶體存取，**速度極快** | 每次 `send()` / `receive()` 皆透過系統呼叫由核心轉送 |\n| **同步責任** | **應用程式自行負責**避免同時寫入衝突（如 Bounded Buffer 循環陣列） | 由作業系統／通訊鏈結處理，無須處理記憶體衝突 |\n| **適用場景** | 同機大量資料高速交換（如 POSIX `shm_open` + `ftruncate` + `mmap`） | 少量資料交換、**跨機器分散式系統** |\n\n### 訊息傳遞的設計維度\n- **Naming（命名）**：Direct（直接指定對方行程 ID，模組性較差）vs. Indirect（透過共享 **Mailbox / Port**，支援多對多彈性綁定）。\n- **Synchronization（同步）**：Blocking（Synchronous）vs. Nonblocking（Asynchronous）；當 `send()` 與 `receive()` 皆為 Blocking 時稱為 **Rendezvous**。\n- **Buffering（緩衝）**：Zero Capacity（無緩衝，傳送端必阻塞）、Bounded Capacity（有限佇列，滿時阻塞）、Unbounded Capacity（無限佇列，傳送端永不阻塞）。\n\n### 實務 IPC 與 Client–Server 機制\n- **Mach Message Passing**：透過 **Port** 與 **Port Rights** 控制存取權限；為避免同機傳遞大量訊息的複製開銷，Mach 利用虛擬記憶體將傳送端位址空間直接映射給接收端。\n- **Windows ALPC**：同機雙向通道，依訊息大小採三種策略：$\\le 256\\text{ bytes}$ 經由 Port 佇列複製；較大訊息使用共享記憶體 **Section Object**；超大資料則透過 API 直接讀寫客戶端位址空間。\n- **Pipes**：\n  - **Ordinary / Anonymous Pipes**：單向、僅限具父子關係之同機行程（UNIX `pipe(fd)`，`fd[0]` 讀、`fd[1]` 寫；Windows `CreatePipe()` 需顯式設定句柄繼承）。\n  - **Named Pipes**：無須父子關係、可長期存在。UNIX **FIFOs**（`mkfifo()`）僅支援半雙工與同機位元組串流；Windows `CreateNamedPipe()` 支援全雙工、跨網路與訊息導向傳輸。\n- **Sockets & RPC**：\n  - **Sockets**：網路通訊端點（IP + Port，`<1024` 為 Well-known Ports，Loopback `127.0.0.1`），傳送無結構的位元組串流（TCP `Socket` / UDP `DatagramSocket`）。\n  - **RPC（Remote Procedure Calls）**：將跨機訊息包裝為類似本地函式呼叫，透過 Client/Server **Stubs** 與 **Parameter Marshaling**（如 **XDR** 格式解決 Big-Endian 與 Little-Endian 差異）傳遞結構化參數；可透過時間戳記實現 *at-most-once*，加上 ACK 重傳實現 *exactly-once*，並由 Matchmaker（Rendezvous Daemon）進行動態 Port 綁定。\n  - **Android Binder / RPC**：同機行程間亦廣泛使用 RPC，透過 `Service` 的 `onBind()` 與 **AIDL** 自動生成 Stub 處理參數序列化與跨行程呼叫。\n\n## 五、關聯頁面\n- **同軌來源出處**：[[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5]]\n- **同軌相關概念**：[[concepts/book/OS-Architecture-and-System-Calls]]、[[concepts/book/Threads-and-Concurrency]]、[[concepts/book/CPU-Scheduling]]", "slides": [{"index": 0, "kind": "cover", "title": "行程管理與行程間通訊（IPC）", "markdown": ""}, {"index": 1, "kind": "content", "title": "一、行程（Process）的定義與記憶體配置", "markdown": "## 一、行程（Process）的定義與記憶體配置\n\n根據 [Operating System Concepts (Ch.3)](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)，**Program** 是儲存於磁碟上的被動（Passive）可執行檔，而 **Process** 是載入記憶體執行中的主動（Active）實體。\n\n一個行程在記憶體中的配置分為四個主要區段（另在 C 程式高記憶體區包含 `argc`/`argv`）：\n1. **Text Section**：可執行程式碼（固定大小）。\n2. **Data Section**：全域變數（細分為已初始化的 `data` 與未初始化的 `bss`，固定大小）。\n3. **Heap Section**：執行期動態配置（如 `malloc`）的記憶體，由低位址向高位址動態增長。\n4. **Stack Section**：函式呼叫時的暫存資料（Activation Record：參數、區域變數、返回位址），由高位址向低位址動態增長；作業系統須確保 Stack 與 Heap 不重疊。\n\n### 行程狀態與 PCB（Process Control Block）\n- **五種狀態**：`New` → `Ready` ↔ `Running`（單一核心同時只能有一個行程處於 Running）→ `Waiting`（等待 I/O 或事件）→ `Terminated`。\n- **PCB（Task Control Block）**：儲存重啟行程所需的所有狀態（Process State、Program Counter、CPU Registers、排程參數、記憶體管理資訊、會計統計與 I/O 開啟檔案清單）。在 Linux 核心中，PCB 由 `<include/linux/sched.h>` 的 `struct task_struct` 實作，並以雙向鏈結串列串起所有活躍行程，由 `current` 指標指向當前執行中的行程。"}, {"index": 2, "kind": "content", "title": "二、行程排程佇列與上下文切換（Context Switch）", "markdown": "## 二、行程排程佇列與上下文切換（Context Switch）\n\n- **佇列流轉**：行程進入系統後置於 **Ready Queue**；等待 I/O 或子行程結束時移入對應的 **Wait Queue**。\n- **Context Switch**：當 CPU 核心切換執行另一行程時，核心必須將舊行程的 CPU 暫存器、狀態與記憶體管理資訊存入其 PCB（State Save），並載入新行程的 PCB 狀態（State Restore）。**Context Switch 是純系統開銷（Pure Overhead）**，耗時數微秒，取決於記憶體速度、暫存器數量（若硬體提供多組暫存器組可僅切換指標）與位址空間保存複雜度。"}, {"index": 3, "kind": "content", "title": "三、行程建立、終止與特殊狀態", "markdown": "## 三、行程建立、終止與特殊狀態\n\n1. **UNIX/Linux 建立模型（`fork()` + `exec()`）**：\n   - `fork()` 複製父行程位址空間建立子行程；子行程收到回傳值 `0`，父行程收到子行程的 `pid`。\n   - 子行程常接著呼叫 `exec()`（如 `execlp()`）以新程式覆寫自身記憶體空間；父行程可呼叫 `wait()` 阻塞等待子行程結束，或與其並行執行。\n   - **Windows 對比**：`CreateProcess()` 需傳入至少 10 個參數，且在建立當下即直接載入指定的新程式，不複製父行程位址空間；對應 `wait()` 的函式為 `WaitForSingleObject()`。\n2. **終止、殭屍與孤兒行程**：\n   - **Zombie Process（殭屍行程）**：子行程已呼叫 `exit()` 終止並釋放資源，但父行程尚未呼叫 `wait()` 讀取其結束狀態，因此仍佔用 Process Table 項目。\n   - **Orphan Process（孤兒行程）**：父行程未呼叫 `wait()` 即提前終止，導致子行程失去父行程。傳統 UNIX 由 `init`（`pid = 1`）收養並定期 `wait()` 回收；現代 Linux 由 `systemd`（或指定繼承行程）處理。\n3. **Android 行程重要性階層**：因行動裝置記憶體有限，系統回收資源時依序由低到高終止：Empty → Background → Service → Visible → Foreground Process。"}, {"index": 4, "kind": "content", "title": "四、行程間通訊（IPC：Interprocess Communication）", "markdown": "## 四、行程間通訊（IPC：Interprocess Communication）\n\n協作行程（Cooperating Processes）可透過兩種基本模型交換資料：\n\n| 比較維度 | Shared Memory（共享記憶體） | Message Passing（訊息傳遞） |\n| :--- | :--- | :--- |\n| **核心介入時機** | 僅在「建立」共享區段時需系統呼叫，之後如同一般記憶體存取，**速度極快** | 每次 `send()` / `receive()` 皆透過系統呼叫由核心轉送 |\n| **同步責任** | **應用程式自行負責**避免同時寫入衝突（如 Bounded Buffer 循環陣列） | 由作業系統／通訊鏈結處理，無須處理記憶體衝突 |\n| **適用場景** | 同機大量資料高速交換（如 POSIX `shm_open` + `ftruncate` + `mmap`） | 少量資料交換、**跨機器分散式系統** |\n\n### 訊息傳遞的設計維度\n- **Naming（命名）**：Direct（直接指定對方行程 ID，模組性較差）vs. Indirect（透過共享 **Mailbox / Port**，支援多對多彈性綁定）。\n- **Synchronization（同步）**：Blocking（Synchronous）vs. Nonblocking（Asynchronous）；當 `send()` 與 `receive()` 皆為 Blocking 時稱為 **Rendezvous**。\n- **Buffering（緩衝）**：Zero Capacity（無緩衝，傳送端必阻塞）、Bounded Capacity（有限佇列，滿時 , "label": "Operating System Concepts (10th Ed.) Ch.1–5 來源筆記"}]}, {"slug": "concepts/book/Threads-and-Concurrency", "frontmatter": {"title": "執行緒、平行運算與隱式多工", "type": "concept", "source_type": "book", "tags": ["course-notes", "book", "operating-systems", "threads", "concurrency", "parallelism"], "created": "2026-11-16", "updated": "2026-11-16", "sources": ["[[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5]]"], "status": "growing", "authors": "", "raw_file": ""}, "content": "# 執行緒、平行運算與隱式多工\n\n## 一、執行緒（Thread）概念與優勢\n\n根據 [Operating System Concepts (Ch.4)](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)，執行緒是 CPU 使用的基本單位：\n- **獨立擁有的資源**：Thread ID、Program Counter (PC)、Register Set、Stack。\n- **同行程內共享的資源**：Code Section、Data Section（全域變數）、Heap 與作業系統資源（開啟檔案、訊號）。\n- **四大優勢**：**Responsiveness**（UI 或伺服器不因單一阻塞停擺）、**Resource Sharing**（預設共享記憶體，不需額外設定 IPC）、**Economy**（建立與 Context Switch 成本遠低於行程）、**Scalability**（可在多核架構上真正平行執行）。\n\n---\n\n## 二、多核平行運算與 Amdahl's Law\n\n- **Concurrency vs. Parallelism**：**並行（Concurrency）** 指多個任務能交替取得進展（單核即可透過時間切片達成）；**平行（Parallelism）** 指多個任務在同一時刻真正同時執行（必須具備多核硬體）。\n- **Data Parallelism vs. Task Parallelism**：Data Parallelism 將同一份資料切分給多個核心執行相同運算（如陣列分段加總）；Task Parallelism 則是將不同任務（執行緒）分配至各核心執行各自獨立的操作。\n- **Amdahl's Law（阿姆達爾定律）**：若程式中有比例 $S$ 必須序列（Serial）執行，在 $N$ 個處理核心上的理論最大加速比為：\n  $$\\text{speedup} \\le \\frac{1}{S + \\frac{1-S}{N}}$$\n  當 $N \\to \\infty$ 時，加速比收斂於 $1/S$（例如 50% 序列的程式無論加多少核心，加速上限僅為 2 倍），說明序列瓶頸對多核擴展性具有決定性影響。\n\n---\n\n## 三、多執行緒模型與顯式 API\n\n1. **三種使用者／核心執行緒對應模型**：\n   - **Many-to-One**：多個 User Threads 對應 1 個 Kernel Thread。管理快，但任一執行緒呼叫阻塞式系統呼叫會卡住整個行程，且無法利用多核平行（如早期 Green Threads）。\n   - **One-to-One**：每個 User Thread 對應 1 個 Kernel Thread（**Linux 與 Windows 皆採用此模型**）。支援多核平行與非阻塞切換，但建立大量執行緒會帶來核心資源負擔。\n   - **Many-to-Many / Two-level**：將多個 User Threads 多工映射至較少或相等數量的 Kernel Threads（透過中介的 **LWP, Lightweight Process** 與 **Scheduler Activations / Upcalls** 動態調整）；雖彈性最高但實作複雜，現代系統多以 One-to-One 搭配上層隱式任務框架取代。\n2. **三大顯式執行緒函式庫**：\n   - **POSIX Pthreads**：規格標準（IEEE 1003.1c），常用 `pthread_create()`、`pthread_join()`、`pthread_exit()`（Linux/macOS 原生支援）。\n   - **Windows Threads**：核心層級 API，使用 `CreateThread()`、`WaitForSingleObject()` / `WaitForMultipleObjects()`。\n   - **Java Threads**：可繼承 `Thread` 或實作 `Runnable`（支援 Lambda），並透過 `java.util.concurrent` 的 `ExecutorService`、`Callable<V>` 與 `Future<V>` 讓執行緒回傳非同步運算結果。\n\n---\n\n## 四、隱式多工（Implicit Threading）\n\n為解決多核時代管理數百至數千執行緒的複雜度，現代開發改由開發者標註「可平行執行的任務（Tasks）」，將執行緒建立、回收與排程交由編譯器或執行期函式庫管理：\n\n| 技術／框架 | 適用平台／語言 | 核心機制 |\n| :--- | :--- | :--- |\n| **Thread Pools** | Windows (`QueueUserWorkItem`)、Java (`Executors`)、Android AIDL | 預先建立固定或動態數量的執行緒池，限制資源上限並省去重複建立／銷毀開銷 |\n| **Fork-Join Framework** | Java (`ForkJoinPool`) | 專為遞迴分治演算法設計（`RecursiveTask` / `RecursiveAction`），內建 **Work Stealing** 演算法平衡各執行緒佇列負載 |\n| **OpenMP** | C / C++ / Fortran | 透過編譯器指令（如 `#pragma omp parallel for`）自動將平行區塊或迴圈分配至多核執行緒 |\n| **Grand Central Dispatch (GCD)** | Apple macOS / iOS (`libdispatch`) | 以 Serial（FIFO 依序）與 Concurrent（全域 4 級 QoS）Dispatch Queues 管理 C Blocks (`^{}`) 或 Swift Closures，動態伸縮 POSIX 執行緒池 |\n| **Intel TBB** | C++ 跨平台 | 樣板函式庫（如 `parallel_for`），具備 **Cache-aware** 與負載平衡任務排程器，並提供執行緒安全容器 |\n\n---\n\n## 五、多執行緒設計議題與 Linux 統一任務模型\n\n1. **`fork()` 與 `exec()` 語意**：多執行緒程式呼叫 `fork()` 時，若立即接續 `exec()`（替換整個行程），僅需複製呼叫者執行緒；否則需複製全部執行緒。\n2. **訊號與取消（Signals & Cancellation）**：\n   - 同步訊號（如除以零）送至觸發執行緒；非同步訊號可由特定或非遮罩執行緒接收（`pthread_kill()`，Windows 則使用 **APCs**）。\n   - 執行緒終止強烈建議採用 **Deferred Cancellation**（透過 Cancellation Points 如 `pthread_testcancel()` 或 Java `interrupt()`/`isInterrupted()` 檢查並搭配 Cleanup Handler 釋放資源），避免 Asynchronous Cancellation 造成鎖或資源洩漏。\n3. **Thread-Local Storage (TLS)**：跨函式呼叫但為單一執行緒私有的資料（如交易 ID），對應 Java `ThreadLocal<T>`、Pthreads `pthread_key_t`、GCC `__thread`。\n4. **Windows vs. Linux 核心模型**：\n   - Windows 明確區分行程與執行緒，核心空間維護 `ETHREAD` 與 `KTHREAD`，使用者空間維護 `TEB`。\n   - **Linux 不區分 Process 與 Thread，統一稱為 Task**（皆對應一個 `struct task_struct`）。透過 `clone()` 系統呼叫傳入旗標（`CLONE_FS`、`CLONE_VM`、`CLONE_SIGHAND`、`CLONE_FILES`）決定子任務與父任務共享多少資源結構：全不共享即為 `fork()` 行程，全共享即為執行緒；此彈性機制亦是 **Linux Containers** 隔離實作的基礎。\n\n## 六、關聯頁面\n- **同軌來源出處**：[Operating System Concepts (10th Ed.) Ch.1–5 來源筆記](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)\n- **同軌相關概念**：[行程管理與行程間通訊（IPC）](#deck/concepts/book/Processes-and-IPC)、[CPU 排程演算法與多核／即時排程](#deck/concepts/book/CPU-Scheduling)", "rawContent": "# 執行緒、平行運算與隱式多工\n\n## 一、執行緒（Thread）概念與優勢\n\n根據 [[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5|Operating System Concepts (Ch.4)]]，執行緒是 CPU 使用的基本單位：\n- **獨立擁有的資源**：Thread ID、Program Counter (PC)、Register Set、Stack。\n- **同行程內共享的資源**：Code Section、Data Section（全域變數）、Heap 與作業系統資源（開啟檔案、訊號）。\n- **四大優勢**：**Responsiveness**（UI 或伺服器不因單一阻塞停擺）、**Resource Sharing**（預設共享記憶體，不需額外設定 IPC）、**Economy**（建立與 Context Switch 成本遠低於行程）、**Scalability**（可在多核架構上真正平行執行）。\n\n---\n\n## 二、多核平行運算與 Amdahl's Law\n\n- **Concurrency vs. Parallelism**：**並行（Concurrency）** 指多個任務能交替取得進展（單核即可透過時間切片達成）；**平行（Parallelism）** 指多個任務在同一時刻真正同時執行（必須具備多核硬體）。\n- **Data Parallelism vs. Task Parallelism**：Data Parallelism 將同一份資料切分給多個核心執行相同運算（如陣列分段加總）；Task Parallelism 則是將不同任務（執行緒）分配至各核心執行各自獨立的操作。\n- **Amdahl's Law（阿姆達爾定律）**：若程式中有比例 $S$ 必須序列（Serial）執行，在 $N$ 個處理核心上的理論最大加速比為：\n  $$\\text{speedup} \\le \\frac{1}{S + \\frac{1-S}{N}}$$\n  當 $N \\to \\infty$ 時，加速比收斂於 $1/S$（例如 50% 序列的程式無論加多少核心，加速上限僅為 2 倍），說明序列瓶頸對多核擴展性具有決定性影響。\n\n---\n\n## 三、多執行緒模型與顯式 API\n\n1. **三種使用者／核心執行緒對應模型**：\n   - **Many-to-One**：多個 User Threads 對應 1 個 Kernel Thread。管理快，但任一執行緒呼叫阻塞式系統呼叫會卡住整個行程，且無法利用多核平行（如早期 Green Threads）。\n   - **One-to-One**：每個 User Thread 對應 1 個 Kernel Thread（**Linux 與 Windows 皆採用此模型**）。支援多核平行與非阻塞切換，但建立大量執行緒會帶來核心資源負擔。\n   - **Many-to-Many / Two-level**：將多個 User Threads 多工映射至較少或相等數量的 Kernel Threads（透過中介的 **LWP, Lightweight Process** 與 **Scheduler Activations / Upcalls** 動態調整）；雖彈性最高但實作複雜，現代系統多以 One-to-One 搭配上層隱式任務框架取代。\n2. **三大顯式執行緒函式庫**：\n   - **POSIX Pthreads**：規格標準（IEEE 1003.1c），常用 `pthread_create()`、`pthread_join()`、`pthread_exit()`（Linux/macOS 原生支援）。\n   - **Windows Threads**：核心層級 API，使用 `CreateThread()`、`WaitForSingleObject()` / `WaitForMultipleObjects()`。\n   - **Java Threads**：可繼承 `Thread` 或實作 `Runnable`（支援 Lambda），並透過 `java.util.concurrent` 的 `ExecutorService`、`Callable<V>` 與 `Future<V>` 讓執行緒回傳非同步運算結果。\n\n---\n\n## 四、隱式多工（Implicit Threading）\n\n為解決多核時代管理數百至數千執行緒的複雜度，現代開發改由開發者標註「可平行執行的任務（Tasks）」，將執行緒建立、回收與排程交由編譯器或執行期函式庫管理：\n\n| 技術／框架 | 適用平台／語言 | 核心機制 |\n| :--- | :--- | :--- |\n| **Thread Pools** | Windows (`QueueUserWorkItem`)、Java (`Executors`)、Android AIDL | 預先建立固定或動態數量的執行緒池，限制資源上限並省去重複建立／銷毀開銷 |\n| **Fork-Join Framework** | Java (`ForkJoinPool`) | 專為遞迴分治演算法設計（`RecursiveTask` / `RecursiveAction`），內建 **Work Stealing** 演算法平衡各執行緒佇列負載 |\n| **OpenMP** | C / C++ / Fortran | 透過編譯器指令（如 `#pragma omp parallel for`）自動將平行區塊或迴圈分配至多核執行緒 |\n| **Grand Central Dispatch (GCD)** | Apple macOS / iOS (`libdispatch`) | 以 Serial（FIFO 依序）與 Concurrent（全域 4 級 QoS）Dispatch Queues 管理 C Blocks (`^{}`) 或 Swift Closures，動態伸縮 POSIX 執行緒池 |\n| **Intel TBB** | C++ 跨平台 | 樣板函式庫（如 `parallel_for`），具備 **Cache-aware** 與負載平衡任務排程器，並提供執行緒安全容器 |\n\n---\n\n## 五、多執行緒設計議題與 Linux 統一任務模型\n\n1. **`fork()` 與 `exec()` 語意**：多執行緒程式呼叫 `fork()` 時，若立即接續 `exec()`（替換整個行程），僅需複製呼叫者執行緒；否則需複製全部執行緒。\n2. **訊號與取消（Signals & Cancellation）**：\n   - 同步訊號（如除以零）送至觸發執行緒；非同步訊號可由特定或非遮罩執行緒接收（`pthread_kill()`，Windows 則使用 **APCs**）。\n   - 執行緒終止強烈建議採用 **Deferred Cancellation**（透過 Cancellation Points 如 `pthread_testcancel()` 或 Java `interrupt()`/`isInterrupted()` 檢查並搭配 Cleanup Handler 釋放資源），避免 Asynchronous Cancellation 造成鎖或資源洩漏。\n3. **Thread-Local Storage (TLS)**：跨函式呼叫但為單一執行緒私有的資料（如交易 ID），對應 Java `ThreadLocal<T>`、Pthreads `pthread_key_t`、GCC `__thread`。\n4. **Windows vs. Linux 核心模型**：\n   - Windows 明確區分行程與執行緒，核心空間維護 `ETHREAD` 與 `KTHREAD`，使用者空間維護 `TEB`。\n   - **Linux 不區分 Process 與 Thread，統一稱為 Task**（皆對應一個 `struct task_struct`）。透過 `clone()` 系統呼叫傳入旗標（`CLONE_FS`、`CLONE_VM`、`CLONE_SIGHAND`、`CLONE_FILES`）決定子任務與父任務共享多少資源結構：全不共享即為 `fork()` 行程，全共享即為執行緒；此彈性機制亦是 **Linux Containers** 隔離實作的基礎。\n\n## 六、關聯頁面\n- **同軌來源出處**：[[sources/book/2018-Silberschatz-OS-Concepts-Ch1-5]]\n- **同軌相關概念**：[[concepts/book/Processes-and-IPC]]、[[concepts/book/CPU-Scheduling]]", "slides": [{"index": 0, "kind": "cover", "title": "執行緒、平行運算與隱式多工", "markdown": ""}, {"index": 1, "kind": "content", "title": "一、執行緒（Thread）概念與優勢", "markdown": "## 一、執行緒（Thread）概念與優勢\n\n根據 [Operating System Concepts (Ch.4)](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)，執行緒是 CPU 使用的基本單位：\n- **獨立擁有的資源**：Thread ID、Program Counter (PC)、Register Set、Stack。\n- **同行程內共享的資源**：Code Section、Data Section（全域變數）、Heap 與作業系統資源（開啟檔案、訊號）。\n- **四大優勢**：**Responsiveness**（UI 或伺服器不因單一阻塞停擺）、**Resource Sharing**（預設共享記憶體，不需額外設定 IPC）、**Economy**（建立與 Context Switch 成本遠低於行程）、**Scalability**（可在多核架構上真正平行執行）。"}, {"index": 2, "kind": "content", "title": "二、多核平行運算與 Amdahl's Law", "markdown": "## 二、多核平行運算與 Amdahl's Law\n\n- **Concurrency vs. Parallelism**：**並行（Concurrency）** 指多個任務能交替取得進展（單核即可透過時間切片達成）；**平行（Parallelism）** 指多個任務在同一時刻真正同時執行（必須具備多核硬體）。\n- **Data Parallelism vs. Task Parallelism**：Data Parallelism 將同一份資料切分給多個核心執行相同運算（如陣列分段加總）；Task Parallelism 則是將不同任務（執行緒）分配至各核心執行各自獨立的操作。\n- **Amdahl's Law（阿姆達爾定律）**：若程式中有比例 $S$ 必須序列（Serial）執行，在 $N$ 個處理核心上的理論最大加速比為：\n  $$\\text{speedup} \\le \\frac{1}{S + \\frac{1-S}{N}}$$\n  當 $N \\to \\infty$ 時，加速比收斂於 $1/S$（例如 50% 序列的程式無論加多少核心，加速上限僅為 2 倍），說明序列瓶頸對多核擴展性具有決定性影響。"}, {"index": 3, "kind": "content", "title": "三、多執行緒模型與顯式 API", "markdown": "## 三、多執行緒模型與顯式 API\n\n1. **三種使用者／核心執行緒對應模型**：\n   - **Many-to-One**：多個 User Threads 對應 1 個 Kernel Thread。管理快，但任一執行緒呼叫阻塞式系統呼叫會卡住整個行程，且無法利用多核平行（如早期 Green Threads）。\n   - **One-to-One**：每個 User Thread 對應 1 個 Kernel Thread（**Linux 與 Windows 皆採用此模型**）。支援多核平行與非阻塞切換，但建立大量執行緒會帶來核心資源負擔。\n   - **Many-to-Many / Two-level**：將多個 User Threads 多工映射至較少或相等數量的 Kernel Threads（透過中介的 **LWP, Lightweight Process** 與 **Scheduler Activations / Upcalls** 動態調整）；雖彈性最高但實作複雜，現代系統多以 One-to-One 搭配上層隱式任務框架取代。\n2. **三大顯式執行緒函式庫**：\n   - **POSIX Pthreads**：規格標準（IEEE 1003.1c），常用 `pthread_create()`、`pthread_join()` 一個 `struct task_struct`）。透過 `clone()` 系統呼叫傳入旗標（`CLONE_FS`、`CLONE_VM`、`CLONE_SIGHAND`、`CLONE_FILES`）決定子任務與父任務共享多少資源結構：全不共享即為 `fork()` 行程，全共享即為執行緒；此彈性機制亦是 **Linux Containers** 隔離實作的基礎。"}, {"index": 6, "kind": "content", "title": "六、關聯頁面", "markdown": "## 六、關聯頁面\n- **同軌來源出處**：[Operating System Concepts (10th Ed.) Ch.1–5 來源筆記](#deck/sources/book/2018-Silberschatz-OS-Concepts-Ch1-5)\n- **同軌相關概念**：[行程管理與行程間通訊（IPC）](#deck/concepts/book/Processes-and-IPC)、[CPU 排程演算法與多核／即時排程](#deck/concepts/book/CPU-Scheduling)"}], "sourceRefs": [{"slug": "sources/book/2018-Silberschatz-OS-Concepts-Ch1-5", "label": "Operating System Concepts (10th Ed.) Ch.1–5 來源筆記"}], "backlinks": [{"slug": "concepts/book/CPU-Scheduling", "label": "CPU 排程演算法與多核／即時排程"}, {"slug": "concepts/book/OS-Architecture-and-System-Calls", "label": "作業系統架構、系統呼叫與核心除錯"}, {"slug": "concepts/book/Processes-and-IPC", "label": "行程管理與行程間通訊（IPC）"}, {"slug": "overview", "label": "課程簡報與原文書知識庫全域總覽"}, {"slug": "sources/book/2018-Silberschatz-OS-Concepts-Ch1-5", "label": "Operating System Concepts (10th Ed.) Ch.1–5 來源筆記"}]}, {"slug": "concepts/ppt/Complex-Linked-Lists", "frontmatter": {"title": "進階鏈結串列結構（環狀、雙向、多重鏈結）", "type": "concept", "source_type": "ppt", "tags": ["course-notes", "ppt", "data-structures", "linked-list", "doubly-linked-list"], "created": "2026-11-16", "updated": "2026-11-16", "sources": ["[[sources/ppt/DS_Ch3-Linked-Lists]]"], "status": "growing", "authors": "", "raw_file": ""}, "content": "# 進階鏈結串列結構（環狀、雙向、多重鏈結）\n\n> 本頁僅累積來自 **`ppt` 軌道（`raw/ppt/`）** 之知識內容；若需對照另一軌道的說法，請見文末「對應他軌參考」或 `wiki/comparisons/`。\n\n## 一、定義與核心直覺\n\n根據 [資料結構 Ch.3 課程簡報（Section 3-6）](#deck/sources/ppt/DS_Ch3-Linked-Lists)，為克服單向鏈結串列只能單向走訪與單一排序的限制，衍生出三種進階鏈結串列結構：\n1. **環狀鏈結串列（Circularly Linked List）**：最後一個節點的 `link` 指標指回第一個節點，形成封閉迴圈。\n2. **雙向鏈結串列（Doubly Linked List）**：每個節點同時擁有指向前驅者的 `back`（Backward）指標與指向後繼者的 `fore`（Forward）指標。\n3. **多重鏈結串列（Multilinked List）**：同一份實體資料節點擁有多組獨立的鏈結欄位，可在不複製資料的情況下依多種邏輯鍵值順序處理同一批資料。\n\n---\n\n## 二、運作機制與詳細說明\n\n### 1. 環狀鏈結串列（Circularly Linked List）\n- **標頭與尾指標**：Header 通常維護 `count`、`pos`、`rear` 與 `head/link`。當**插入或刪除最後一個節點**時，必須同步更新兩件事：(1) Header 的 `rear` 指標；(2) 最後一個節點的 `link` 指回第一節點。\n- **從中間開始搜尋的風險與解法**：由於環狀結構在機率上從開頭或中間搜尋無差異，但若目標不存在，指標會陷入無窮迴圈。解法是**記錄起始節點位址 `startAddress`**，將迴圈終止條件設為：`target != pLoc->data.key AND pLoc->link != startAddress`。\n\n### 2. 雙向鏈結串列（Doubly Linked List）\n- **雙向指標與 Metadata**：標頭結構包含 `count`、`head` 與 `rear`（`rear` 非絕對必要，但能讓許多演算法更有效率）。若將最後節點的 `fore` 指回第一節點、且第一節點的 `back` 指向最後節點，則構成 **Doubly Linked Circularly Linked List**。\n- **插入邏輯（`insertDbl`，Algorithm 3-22）**：\n  - 回傳值定義：`0`（動態記憶體溢位）、`1`（成功）、`2`（鍵值重複）。\n  - 插入空串列或第一節點前（`pPre == null`）：設定 `pNew->back = null`、`pNew->fore = list.head`、`list.head = pNew`。\n  - 插入中間或結尾（`pPre != null`）：設定 `pNew->fore = pPre->fore`、`pNew->back = pPre`、`pPre->fore = pNew`。\n  - 若插在結尾（`pSucc == null`）則更新 `list.rear = pNew`；否則更新後繼者 `pSucc->back = pNew`。\n- **刪除邏輯（`deleteDbl`，Algorithm 3-23）**：\n  - 若 `pDlt == null` 直接中止（Abort）；遞減 `list.count`。\n  - 處理前驅者：若 `pDlt->back != null`，令 `pPred->fore = pDlt->fore`；否則刪除的是第一節點，更新 `list.head = pDlt->fore`。\n  - 處理後繼者：若 `pDlt->fore != null`，令 `pSucc->back = pDlt->back`；否則刪除的是最後節點，更新 `list.rear = pDlt->back`。\n  - 最後 `recycle(pDlt)` 回收記憶體。\n\n### 3. 多重鏈結串列（Multilinked List）\n- **結構設計**：每筆邏輯序列各自建立一組指標（可為單向、雙向或環狀），共用同一份資料節點記憶體。\n- **插入步驟（`buildMultilinked`）**：將記憶體配置與指標串接分離——先由 `buildNode` 配置一次實體節點並將 `count` 加一，再分別透過各自的搜尋與插入模組（如 `insertPres` 與 `insertSpouse`）接上不同序列的指標。\n\n---\n\n## 三、代表性範例、公式或實作重點\n\n### 簡報課堂勘誤：Algorithm 3-22 (`insertDbl`) 修正\n簡報第 102–103 頁明確指出課本虛擬碼有兩處必須修正之錯誤：\n1. 原第 4.9 行 `pPre->fore = pNew` 應上移至 **4.4.3 行**（即 `else` 區塊中接好 `pNew->fore` 與 `pNew->back` 之後立刻執行）。\n2. 原第 4.6 行判斷條件 `if (pPre->fore null)` 應修正為 **`if (pSucc null)`**，才能正確判斷是否插入於串列尾端並更新 `list.rear`。\n\n### 多重鏈結串列範例：美國總統資料表（Table 3-2 / Figure 3-25）\n在同一組總統資料節點（如 `Washington, 1789, Custis`、`Adams, J, 1797, Smith`、`Jefferson, 1801, Skelton`）中，同時維護 **President link** 與 **Spouse link**（以及對應的 `pres rear`、`sp rear`），即可在不重複儲存資料的情況下，依總統姓名或配偶姓名兩種順序走訪。\n\n---\n\n## 四、常見考點／應用場景與限制\n\n- **指標更新順序（雙向鏈結）**：在中間插入新節點時，務必先用 `pNew->back` 與 `pNew->fore` 記住前後節點，或保留 `pSucc` 指標，再改寫 `pPre->fore` 與 `pSucc->back`，避免指標斷鏈。\n- **空間換取時間與彈性**：雙向鏈結串列每個節點多一個指標空間，但刪除已知指標 `pDlt` 時不需從頭搜尋前驅者；多重鏈結串列則以多組指標空間換取「免資料複製的多維排序」。\n\n---\n\n## 五、關聯頁面\n- **同軌來源出處**：[資料結構 Ch.3 Linked Lists 課程簡報摘要](#deck/sources/ppt/DS_Ch3-Linked-Lists)\n- **同軌相關概念**：[線性串列與單向鏈結串列演算法](#deck/concepts/ppt/Linear-and-Singly-Linked-Lists)、[堆疊（Stack）資料結構、ADT 實作與四大應用](#deck/concepts/ppt/Stacks-and-Applications)", "rawContent": "# 進階鏈結串列結構（環狀、雙向、多重鏈結）\n\n> 本頁僅累積來自 **`ppt` 軌道（`raw/ppt/`）** 之知識內容；若需對照另一軌道的說法，請見文末「對應他軌參考」或 `wiki/comparisons/`。\n\n## 一、定義與核心直覺\n\n根據 [[sources/ppt/DS_Ch3-Linked-Lists|資料結構 Ch.3 課程簡報（Section 3-6）]]，為克服單向鏈結串列只能單向走訪與單一排序的限制，衍生出三種進階鏈結串列結構：\n1. **環狀鏈結串列（Circularly Linked List）**：最後一個節點的 `link` 指標指回第一個節點，形成封閉迴圈。\n2. **雙向鏈結串列（Doubly Linked List）**：每個節點同時擁有指向前驅者的 `back`（Backward）指標與指向後繼者的 `fore`（Forward）指標。\n3. **多重鏈結串列（Multilinked List）**：同一份實體資料節點擁有多組獨立的鏈結欄位，可在不複製資料的情況下依多種邏輯鍵值順序處理同一批資料。\n\n---\n\n## 二、運作機制與詳細說明\n\n### 1. 環狀鏈結串列（Circularly Linked List）\n- **標頭與尾指標**：Header 通常維護 `count`、`pos`、`rear` 與 `head/link`。當**插入或刪除最後一個節點**時，必須同步更新兩件事：(1) Header 的 `rear` 指標；(2) 最後一個節點的 `link` 指回第一節點。\n- **從中間開始搜尋的風險與解法**：由於環狀結構在機率上從開頭或中間搜尋無差異，但若目標不存在，指標會陷入無窮迴圈。解法是**記錄起始節點位址 `startAddress`**，將迴圈終止條件設為：`target != pLoc->data.key AND pLoc->link != startAddress`。\n\n### 2. 雙向鏈結串列（Doubly Linked List）\n- **雙向指標與 Metadata**：標頭結構包含 `count`、`head` 與 `rear`（`rear` 非絕對必要，但能讓許多演算法更有效率）。若將最後節點的 `fore` 指回第一節點、且第一節點的 `back` 指向最後節點，則構成 **Doubly Linked Circularly Linked List**。\n- **插入邏輯（`insertDbl`，Algorithm 3-22）**：\n  - 回傳值定義：`0`（動態記憶體溢位）、`1`（成功）、`2`（鍵值重複）。\n  - 插入空串列或第一節點前（`pPre == null`）：設定 `pNew->back = null`、`pNew->fore = list.head`、`list.head = pNew`。\n  - 插入中間或結尾（`pPre != null`）：設定 `pNew->fore = pPre->fore`、`pNew->back = pPre`、`pPre->fore = pNew`。\n  - 若插在結尾（`pSucc == null`）則更新 `list.rear = pNew`；否則更新後繼者 `pSucc->back = pNew`。\n- **刪除邏輯（`deleteDbl`，Algorithm 3-23）**：\n  - 若 `pDlt == null` 直接中止（Abort）；遞減 `list.count`。\n  - 處理前驅者：若 `pDlt->back != null`，令 `pPred->fore = pDlt->fore`；否則刪除的是第一節點，更新 `list.head = pDlt->fore`。\n  - 處理後繼者：若 `pDlt->fore != null`，令 `pSucc->back = pDlt->back`；否則刪除的是最後節點，更新 `list.rear = pDlt->back`。\n  - 最後 `recycle(pDlt)` 回收記憶體。\n\n### 3. 多重鏈結串列（Multilinked List）\n- **結構設計**：每筆邏輯序列各自建立一組指標（可為單向、雙向或環狀），共用同一份資料節點記憶體。\n- **插入步驟（`buildMultilinked`）**：將記憶體配置與指標串接分離——先由 `buildNode` 配置一次實體節點並將 `count` 加一，再分別透過各自的搜尋與插入模組（如 `insertPres` 與 `insertSpouse`）接上不同序列的指標。\n\n---\n\n## 三、代表性範例、公式或實作重點\n\n### 簡報課堂勘誤：Algorithm 3-22 (`insertDbl`) 修正\n簡報第 102–103 頁明確指出課本虛擬碼有兩處必須修正之錯誤：\n1. 原第 4.9 行 `pPre->fore = pNew` 應上移至 **4.4.3 行**（即 `else` 區塊中接好 `pNew->fore` 與 `pNew->back` 之後立刻執行）。\n2. 原第 4.6 行判斷條件 `if (pPre->fore null)` 應修正為 **`if (pSucc null)`**，才能正確判斷是否插入於串列尾端並更新 `list.rear`。\n\n### 多重鏈結串列範例：美國總統資料表（Table 3-2 / Figure 3-25）\n在同一組總統資料節點（如 `Washington, 1789, Custis`、`Adams, J, 1797, Smith`、`Jefferson, 1801, Skelton`）中，同時維護 **President link** 與 **Spouse link**（以及對應的 `pres rear`、`sp rear`），即可在不重複儲存資料的情況下，依總統姓名或配偶姓名兩種順序走訪。\n\n---\n\n## 四、常見考點／應用場景與限制\n\n- **指標更新順序（雙向鏈結）**：在中間插入新節點時，務必先用 `pNew->back` 與 `pNew->fore` 記住前後節點，或保留 `pSucc` 指標，再改寫 `pPre->fore` 與 `pSucc->back`，避免指標斷鏈。\n- **空間換取時間與彈性**：雙向鏈結串列每個節點多一個指標空間，但刪除已知指標 `pDlt` 時不需從頭搜尋前驅者；多重鏈結串列則以多組指標空間換取「免資料複製的多維排序」。\n\n---\n\n## 五、關聯頁面\n- **同軌來源出處**：[[sources/ppt/DS_Ch3-Linked-Lists]]\n- **同軌相關概念**：[[concepts/ppt/Linear-and-Singly-Linked-Lists]]、[[concepts/ppt/Stacks-and-Applications]]", "slides": [{"index": 0, "kind": "cover", "title": "進階鏈結串列結構（環狀、雙向、多重鏈結）", "markdown": ""}, {"index": 1, "kind": "content", "title": "投影片 2", "markdown": "> 本頁僅累積來自 **`ppt` 軌道（`raw/ppt/`）** 之知識內容；若需對照另一軌道的說法，請見文末「對應他軌參考」或 `wiki/comparisons/`。"}, {"index": 2, "kind": "content", "title": "一、定義與核心直覺", "markdown": "## 一、定義與核心直覺\n\n根據 [資料結構 Ch.3 課程簡報（Section 3-6）](#deck/sources/ppt/DS_Ch3-Linked-Lists)，為克服單向鏈結串列只能單向走訪與單一排序的限制，衍生出三種進階鏈結串列結構：\n1. **環狀鏈結串列（Circularly Linked List）**：最後一個節點的 `link` 指標指回第 e` 與 `pNew->back` 之後立刻執行）。\n2. 原第 4.6 行判斷條件 `if (pPre->fore null)` 應修正為 **`if (pSucc null)`**，才能正確判斷是否插入於串列尾端並更新 `list.rear`。\n\n### 多重鏈結串列範例：美國總統資料表（Table 3-2 / Figure 3-25）\n在同一組總統資料節點（如 `Washington, 1789, Custis`、`Adams, J, 1797, Smith`、`Jefferson, 1801, Skelton`）中，同時維護 **President link** 與 **Spouse link**（以及對應的 `pres rear`、`sp rear`），即可在不重複儲存資料的情況下，依總統姓名或配偶姓名兩種順序走訪。"}, {"index": 5, "kind": "content", "title": "四、常見考點／應用場景與限制", "markdown": "## 四、常見考點／應用場景與限制\n\n- **指標更新順序（雙向鏈結）**：在中間插入新節點時，務必先用 `pNew->back` 與 `pNew->fore` 記住前後節點，或保留 `pSucc` 指標，再改寫 `pPre->fore` 與 `pSucc->back`，避免指標斷鏈。\n- **空間換取時間與彈性**：雙向鏈結串列每個節點多一個指標空間，但刪除已知指標 `pDlt` 時不需從頭搜尋前驅者；多重鏈結串列則以多組指標空間換取「免資料複製的多維排序」。"}, {"index": 6, "kind": "content", "title": "五、關聯頁面", "markdown": "## 五、關聯頁面\n- **同軌來源出處**：[資料結構 Ch.3 Linked Lists 課程簡報摘要](#deck/sources/ppt/DS_Ch3-Linked-Lists)\n- **同軌相關概念**：[線性串列與單向鏈結串列演算法](#deck/concepts/ppt/Linear-and-Singly-Linked-Lists)、[堆疊（Stack）資料結構、ADT 實作與四大應用](#deck/concepts/ppt/Stacks-and-Applications)"}], "sourceRefs": [{"slug": "sources/ppt/DS_Ch3-Linked-Lists", "label": "資料結構 Ch.3 Linked Lists 課程簡報摘要"}], "backlinks": [{"slug": "concepts/ppt/Linear-and-Singly-Linked-Lists", "label": "線性串列與單向鏈結串列演算法"}, {"slug": "concepts/ppt/Stacks-and-Applications", "label": "堆疊（Stack）資料結構、ADT 實作與四大應用"}, {"slug": "overview", "label": "課程簡報與原文書知識庫全域總覽"}, {"slug": "sources/ppt/DS_Ch3-Linked-Lists", "label": "資料結構 Ch.3 Linked Lists 課程簡報摘要"}]}, {"slug": "concepts/ppt/Linear-and-Singly-Linked-Lists", "frontmatter": {"title": "線性串列與單向鏈結串列演算法", "type": "concept", "source_type": "ppt", "tags": ["course-notes", "ppt", "data-structures", "linked-list", "algorithms"], "created": "2026-11-16", "updated": "2026-11-16", "sources": ["[[sources/ppt/DS_Ch3-Linked-Lists]]"], "status": "growing", "authors": "", "raw_file": ""}, "content": "# 線性串列與單向鏈結串列演算法\n\n> 本頁僅累積來自 **`ppt` 軌道（`raw/ppt/`）** 之知識內容；若需對照另一軌道的說法，請見文末「對應他軌參考」或 `wiki/comparisons/`。\n\n## 一、定義與核心直覺\n\n根據 [資料結構 Ch.3 課程簡報](#deck/sources/ppt/DS_Ch3-Linked-Lists)，**線性串列（Linear List）** 是最基礎的循序資料集合，分為兩大類：\n- **一般串列（General List）**：可在任意位置插入與刪除資料，無操作位置限制，細分為：\n  - **無序／隨機串列（Unordered / Random List）**：資料無特定排序。\n  - **有序串列（Ordered List）**：資料依 **鍵值（Key）** 排列；Key 是結構中用來識別或控制資料使用的一個或多個欄位。\n- **受限串列（Restricted List）**：僅能在結構兩端新增或刪除資料，包含 **FIFO（Queue，佇列）** 與 **LIFO（Stack，堆疊）**（詳見 [堆疊（Stack）資料結構、ADT 實作與四大應用](#deck/concepts/ppt/Stacks-and-Applications)）。\n\n### 陣列 vs. 鏈結串列\n| 比較維度 | 陣列（Array） | 單向鏈結串列（Singly Linked List） |\n| :--- | :--- | :--- |\n| **記憶體配置** | 實體連續記憶體 | 節點無實體連續關係，透過指標串聯 |\n| **插入與刪除** | 效率差（須搬移後續元素） | **效率高**（僅需更改指標，無須搬移資料） |\n| **搜尋與存取** | 支援隨機存取與二元搜尋（Binary Search） | **無法使用二元搜尋**，僅能循序搜尋（Sequential Search） |\n\n---\n\n## 二、運作機制與詳細說明\n\n### 節點與標頭結構（Self-Referential Structures）\n- **資料節點（Data Node）**：屬於**自我參照結構**，包含 `data`（含 `key` 與其他欄位）與 `link`（指向同型別下一個節點的指標，最後一個節點為 `null`）。\n- **標頭結構（Head Node Structure）**：儲存整條串列的詮釋資料（Metadata），包含 `count`（節點數）、`head`（指向第一個邏輯節點的 `pHead`）、走訪用的 `pos`（目前位置指標），以及選配的 `rear` / `pLast`（指向最後一個節點以提升搜尋與附加效率）。\n\n### 插入與刪除的簡化邏輯\n- **插入節點（`insertNode`，Algorithm 3-2）**：\n  1. 配置記憶體 `allocate(pNew)`，若記憶體耗盡（Overflow）則回傳 `false`；設定 `pNew->data = dataIn`。\n  2. 將四種插入情境（空串列、最前、中間、最後）簡化為兩類：\n     - `pPre == null`（空串列或插在第一節點前）：`pNew->link = list.head; list.head = pNew;`（**順序不可顛倒**，必須先接上後繼者再改 `head`）。\n     - `pPre != null`（插在中間或最後）：`pNew->link = pPre->link; pPre->link = pNew;`。\n  3. 最後執行 `list.count = list.count + 1`。\n- **刪除節點（`deleteNode`，Algorithm 3-3）**：\n  1. 取出資料 `dataOut = pLoc->data`。\n  2. 四種刪除情境（唯一節點、第一節點、中間、最後）簡化為兩類：\n     - `pPre == null`（刪除第一或唯一節點）：`list.head = pLoc->link;`。\n     - `pPre != null`（刪除中間或最後節點）：`pPre->link = pLoc->link;`。\n  3. 統一執行 `list.count = list.count - 1` 與 `recycle(pLoc)` 釋放動態記憶體。\n\n---\n\n## 三、代表性範例、公式或實作重點\n\n### 有序串列搜尋（`searchList`，Algorithm 3-4）\n從 `pPre = null`、`pLoc = list.head` 出發，當 `pLoc != null && target > pLoc->data.key` 時同步後移 `pPre = pLoc; pLoc = pLoc->link;`。Table 3-1 整理五種回傳狀態：\n\n| 條件 | `pPre` | `pLoc` | 回傳值 |\n| :--- | :--- | :--- | :--- |\n| `target < first node` | `null` | `first node` | `false` |\n| `target == first node` | `null` | `first node` | `true` |\n| `first < target < last` | 小於 target 的最大節點 | 大於 target 的最小節點 | `false` |\n| `target == middle / last` | 目標節點的前驅者 | 目標節點 | `true` |\n| `target > last node` | `last node` | `null` | `false` |\n\n### 走訪與銷毀（`getNext` & `destroyList`）\n- **走訪（`getNext`，Algorithm 3-9）**：利用 `list.pos` 記錄目前位置；`fromWhere == 0` 時從 `list.head` 開始（須防範空串列 `list.count == 0`），否則移動至 `list.pos->link`（須檢查是否已達結尾 `list.pos->link == null`）。\n- **銷毀（`destroyList`，Algorithm 3-10）**：當串列不再使用時，迴圈逐一將 `list.head` 移往下一節點並 `recycle(dltPtr)`，直到 `list.count == 0` 且重設 `list.pos = null`。\n\n### 串列應用：串接與二維陣列表示\n- **串接兩條串列（`append`，Algorithm 3-18）**：若 `list1.count == 0` 則 `list1.head = list2.head`；否則走訪至 `list1` 最後一個節點（`pLoc->link == null`），令 `pLoc->link = list2.head`，並更新 `list1.count += list2.count`。\n- **Array of Lists（Algorithm 3-19–3-21）**：以一維陣列儲存多個串列的 Metadata `(count, pos, head)`，每個陣列元素對應二維表格的一列（Row），而該串列的節點則代表各欄（Column）。\n\n---\n\n## 四、常見考點／應用場景與限制\n\n- **四大操作與限制**：Insertion、Deletion、Retrieval 適用於所有線性串列，但 **List Traversal 不適用於受限串列**（Queue/Stack 只能存取端點，且部分情境下 Retrieval 會移除資料）。\n- **測試計畫（Testing Insert & Delete Logic）**：驗證插入與刪除邏輯時，課堂強調必須分別測試 4 種邊界案例：空串列（null list）、第一筆資料前／第一筆資料、兩筆資料之間、以及最後一筆資料之後／最後一筆資料。\n- **非鍵值搜尋（Unordered List Search）**：若依非鍵值欄位搜尋，可能有多筆資料符合條件，解法是回傳所有符合條件元素的串列。\n- **資料隱藏（Data Hiding）**：`emptyList`、`fullList`（嘗試 `allocate` 測試是否溢位後立即 `recycle`）與 `listCount` 雖邏輯簡單，仍應封裝為獨立介面，避免呼叫端直接相依於內部結構。\n\n---\n\n## 五、關聯頁面\n- **同軌來源出處**：[資料結構 Ch.3 Linked Lists 課程簡報摘要](#deck/sources/ppt/DS_Ch3-Linked-Lists)\n- **同軌相關概念**：[進階鏈結串列結構（環狀、雙向、多重鏈結）](#deck/concepts/ppt/Complex-Linked-Lists)、[堆疊（Stack）資料結構、ADT 實作與四大應用](#deck/concepts/ppt/Stacks-and-Applications)", "rawContent": "# 線性串列與單向鏈結串列演算法\n\n> 本頁僅累積來自 **`ppt` 軌道（`raw/ppt/`）** 之知識內容；若需對照另一軌道的說法，請見文末「對應他軌參考」或 `wiki/comparisons/`。\n\n## 一、定義與核心直覺\n\n根據 [[sources/ppt/DS_Ch3-Linked-Lists|資料結構 Ch.3 課程簡報]]，**線性串列（Linear List）** 是最基礎的循序資料集合，分為兩大類：\n- **一般串列（General List）**：可在任意位置插入與刪除資料，無操作位置限制，細分為：\n  - **無序／隨機串列（Unordered / Random List）**：資料無特定排序。\n  - **有序串列（Ordered List）**：資料依 **鍵值（Key）** 排列；Key 是結構中用來識別或控制資料使用的一個或多個欄位。\n- **受限串列（Restricted List）**：僅能在結構兩端新增或刪除資料，包含 **FIFO（Queue，佇列）** 與 **LIFO（Stack，堆疊）**（詳見 [[concepts/ppt/Stacks-and-Applications]]）。\n\n### 陣列 vs. 鏈結串列\n| 比較維度 | 陣列（Array） | 單向鏈結串列（Singly Linked List） |\n| :--- | :--- | :--- |\n| **記憶體配置** | 實體連續記憶體 | 節點無實體連續關係，透過指標串聯 |\n| **插入與刪除** | 效率差（須搬移後續元素） | **效率高**（僅需更改指標，無須搬移資料） |\n| **搜尋與存取** | 支援隨機存取與二元搜尋（Binary Search） | **無法使用二元搜尋**，僅能循序搜尋（Sequential Search） |\n\n---\n\n## 二、運作機制與詳細說明\n\n### 節點與標頭結構（Self-Referential Structures）\n- **資料節點（Data Node）**：屬於**自我參照結構**，包含 `data`（含 `key` 與其他欄位）與 `link`（指向同型別下一個節點的指標，最後一個節點為 `null`）。\n- **標頭結構（Head Node Structure）**：儲存整條串列的詮釋資料（Metadata），包含 `count`（節點數）、`head`（指向第一個邏輯節點的 `pHead`）、走訪用的 `pos`（目前位置指標），以及選配的 `rear` / `pLast`（指向最後一個節點以提升搜尋與附加效率）。\n\n### 插入與刪除的簡化邏輯\n- **插入節點（`insertNode`，Algorithm 3-2）**：\n  1. 配置記憶體 `allocate(pNew)`，若記憶體耗盡（Overflow）則回傳 `false`；設定 `pNew->data = dataIn`。\n  2. 將四種插入情境（空串列、最前、中間、最後）簡化為兩類：\n     - `pPre == null`（空串列或插在第一節點前）：`pNew->link = list.head; list.head = pNew;`（**順序不可顛倒**，必須先接上後繼者再改 `head`）。\n     - `pPre != null`（插在中間或最後）：`pNew->link = pPre->link; pPre->link = pNew;`。\n  3. 最後執行 `list.count = list.count + 1`。\n- **刪除節點（`deleteNode`，Algorithm 3-3）**：\n  1. 取出資料 `dataOut = pLoc->data`。\n  2. 四種刪除情境（唯一節點、第一節點、中間、最後）簡化為兩類：\n     - `pPre == null`（刪除第一或唯一節點）：`list.head = pLoc->link;`。\n     - `pPre != null`（刪除中間或最後節點）：`pPre->link = pLoc->link;`。\n  3. 統一執行 `list.count = list.count - 1` 與 `recycle(pLoc)` 釋放動態記憶體。\n\n---\n\n## 三、代表性範例、公式或實作重點\n\n### 有序串列搜尋（`searchList`，Algorithm 3-4）\n從 `pPre = null`、`pLoc = list.head` 出發，當 `pLoc != null && target > pLoc->data.key` 時同步後移 `pPre = pLoc; pLoc = pLoc->link;`。Table 3-1 整理五種回傳狀態：\n\n| 條件 | `pPre` | `pLoc` | 回傳值 |\n| :--- | :--- | :--- | :--- |\n| `target < first node` | `null` | `first node` | `false` |\n| `target == first node` | `null` | `first node` | `true` |\n| `first < target < last` | 小於 target 的最大節點 | 大於 target 的最小節點 | `false` |\n| `target == middle / last` | 目標節點的前驅者 | 目標節點 | `true` |\n| `target > last node` | `last node` | `null` | `false` |\n\n### 走訪與銷毀（`getNext` & `destroyList`）\n- **走訪（`getNext`，Algorithm 3-9）**：利用 `list.pos` 記錄目前位置；`fromWhere == 0` 時從 `list.head` 開始（須防範空串列 `list.count == 0`），否則移動至 `list.pos->link`（須檢查是否已達結尾 `list.pos->link == null`）。\n- **銷毀（`destroyList`，Algorithm 3-10）**：當串列不再使用時，迴圈逐一將 `list.head` 移往下一節點並 `recycle(dltPtr)`，直到 `list.count == 0` 且重設 `list.pos = null`。\n\n### 串列應用：串接與二維陣列表示\n- **串接兩條串列（`append`，Algorithm 3-18）**：若 `list1.count == 0` 則 `list1.head = list2.head`；否則走訪至 `list1` 最後一個節點（`pLoc->link == null`），令 `pLoc->link = list2.head`，並更新 `list1.count += list2.count`。\n- **Array of Lists（Algorithm 3-19–3-21）**：以一維陣列儲存多個串列的 Metadata `(count, pos, head)`，每個陣列元素對應二維表格的一列（Row），而該串列的節點則代表各欄（Column）。\n\n---\n\n## 四、常見考點／應用場景與限制\n\n- **四大操作與限制**：Insertion、Deletion、Retrieval 適用於所有線性串列，但 **List Traversal 不適用於受限串列**（Queue/Stack 只能存取端點，且部分情境下 Retrieval 會移除資料）。\n- **測試計畫（Testing Insert & Delete Logic）**：驗證插入與刪除邏輯時，課堂強調必須分別測試 4 種邊界案例：空串列（null list）、第一筆資料前／第一筆資料、兩筆資料之間、以及最後一筆資料之後／最後一筆資料。\n- **非鍵值搜尋（Unordered List Search）**：若依非鍵值欄位搜尋，可能有多筆資料符合條件，解法是回傳所有符合條件元素的串列。\n- **資料隱藏（Data Hiding）**：`emptyList`、`fullList`（嘗試 `allocate` 測試是否溢位後立即 `recycle`）與 `listCount` 雖邏輯簡單，仍應封裝為獨立介面，避免呼叫端直接相依於內部結構。\n\n---\n\n## 五、關聯頁面\n- **同軌來源出處**：[[sources/ppt/DS_Ch3-Linked-Lists]]\n- **同軌相關概念**：[[concepts/ppt/Complex-Linked-Lists]]、[[concepts/ppt/Stacks-and-Applications]]", "slides": [{"index": 0, "kind": "cover", "title": "線性串列與單向鏈結串列演算法", "markdown": ""}, {"index": 1, "kind": "content", "title": "投影片 2", "markdown": "> 本頁僅累積來自 **`ppt` 軌道（`raw/ppt/`）** 之知識內容；若需對照另一軌道的說法，請見文末「對應他軌參考」或 `wiki/comparisons/`。"}, {"index": 2, "kind": "content", "title": "一、定義與核心直覺", "markdown": "## 一、定義與核心直覺\n\n根據 [資料結構 Ch.3 課程簡報](#deck/sources/ppt/DS_Ch3-Linked-Lists)，**線性串列（Linear List）** 是最基礎的循序資料集合，分為兩大類：\n- **一般串列（Genera l": "資料結構 Ch.3 Linked Lists 課程簡報摘要"}], "backlinks": [{"slug": "concepts/ppt/Complex-Linked-Lists", "label": "進階鏈結串列結構（環狀、雙向、多重鏈結）"}, {"slug": "concepts/ppt/Stacks-and-Applications", "label": "堆疊（Stack）資料結構、ADT 實作與四大應用"}, {"slug": "overview", "label": "課程簡報與原文書知識庫全域總覽"}, {"slug": "sources/ppt/DS_Ch3-Linked-Lists", "label": "資料結構 Ch.3 Linked Lists 課程簡報摘要"}]}, {"slug": "concepts/ppt/Stacks-and-Applications", "frontmatter": {"title": "堆疊（Stack）資料結構、ADT 實作與四大應用", "type": "concept", "source_type": "ppt", "tags": ["course-notes", "ppt", "data-structures", "stack", "algorithms"], "created": "2026-11-16", "updated": "2026-11-16", "sources": ["[[sources/ppt/DS_Ch4-Stacks]]"], "status": "growing", "authors": "", "raw_file": ""}, "content": "# 堆疊（Stack）資料結構、ADT 實作與四大應用\n\n> 本頁僅累積來自 **`ppt` 軌道（`raw/ppt/`）** 之知識內容；若需對照另一軌道的說法，請見文末「對應他軌參考」或 `wiki/comparisons/`。\n\n## 一、定義與核心直覺\n\n根據 [資料結構 Ch.4 課程簡報](#deck/sources/ppt/DS_Ch4-Stacks)，**堆疊（Stack）** 是一種受限的線性串列（Restricted Linear List），所有新增與刪除操作都僅限於同一端——**頂端（Top）**，因此具備 **LIFO（Last In, First Out，後進先出）** 特性。例如依序輸入 `{5, 10, 15, 20}`，取出順序必為 `{20, 15, 10, 5}`。\n\n### 三大基本操作與邊界異常\n- **Push**：將資料放入堆疊頂端；若空間已滿則發生 **Overflow**。\n- **Pop**：移除堆疊頂端資料並回傳給呼叫端；若堆疊為空則發生 **Underflow**。\n- **Stack Top**：複製並回傳頂端資料**但不刪除**（用來偷看即將被 Pop 的元素）；若堆疊為空同樣發生 **Underflow**。\n\n---\n\n## 二、運作機制與詳細說明\n\n### 1. 鏈結串列實作（Stack Linked List Implementation）\n將堆疊設計為抽象資料型別（ADT）可放入函式庫重複呼叫，並透過**資料隱藏（Data Hiding）**避免外部直接存取內部指標。\n- **結構定義**：\n  - `stack` 標頭結構：`count`（`<integer>`）、`top`（`<node pointer>`）。\n  - `node` 資料節點：`data`（`<dataType>`）、`next`（`<node pointer>`）。\n- **八大標準操作（Algorithm 4-1–4-8）**：\n  - `createStack`：初始化 `stack.count = 0`、`stack.top = null`。\n  - `pushStack`：檢查 `stack full`（記憶體配置失敗回傳 `false`），否則配置 `newPtr`，令 `newPtr->next = stack.top`、`stack.top = newPtr`、`stack.count++`。\n  - `popStack`：檢查 `stack empty`（回傳 `false`），否則保存 `dltPtr = stack.top`、`dataOut = stack.top->data`、更新 `stack.top = stack.top->next`、`stack.count--` 並 `recycle(dltPtr)`。\n  - `stackTop`：若非空則回傳 `stack.top->data`。\n  - `emptyStack` / `fullStack` / `stackCount`：封裝狀態檢查，體現資料隱藏原則。\n  - `destroyStack`：迴圈逐一釋放 `stack.top` 所指節點並重設 `stack.count = 0`。\n\n### 2. 陣列實作（Stack ADT - Array Implementation）\n- **適用時機**：若在撰寫程式前即可確定堆疊的**最大容量**，陣列實作比鏈結串列更有效率（省去 `next` 指標空間與動態記憶體配置開銷）。\n- **結構差異（Algorithm 4-16）**：`stack` 結構包含 `stackAry`（指向陣列之指標）、`count`、`stackMax`（最大元素數），且 `top` 改為**陣列索引（`<index>`）**而非指標。\n\n---\n\n## 三、代表性範例、公式或實作重點\n\n簡報將堆疊應用歸納為四大類別：\n\n### 1. 資料反轉（Reversing Data）\n- **數字串列反轉（`reverseNumber`，Alg 4-9）**：依序 Push 輸入整數至 `<EOF>` 或堆疊滿，再逐一 Pop 印出即可得反序結果。\n- **十進位轉二進位（`decimalToBinary`，Alg 4-10）**：不斷取 `number % 2` 並 Push 進堆疊、`number = number / 2`，最後全部 Pop 印出，解決餘數由低位到高位產生導致順序顛倒的問題。\n\n### 2. 語法解析（Parsing Data）\n- **括號配對檢查（`parseParens`，Alg 4-11）**：讀入字元，遇到左括號 `(` 就 Push；遇到右括號 `)` 時若堆疊為空代表「右括號多餘（Closing parenthesis not matched）」，否則 Pop 配對；全部讀完後若堆疊非空代表「左括號未閉合（Opening parenthesis not matched）」。\n\n### 3. 延遲資料使用（Postponing Data Usage）\n- **中序轉後序（`inToPostFix`，Alg 4-12）**：運算式分為前序（Prefix：`+ a b`）、中序（Infix：`a + b`）與後序（Postfix：`a b +`）。後序與前序皆**不需括號**且只有唯一求值規則。\n  - 運算子優先權：Priority 2（`*`, `/`）> Priority 1（`+`, `-`）> Priority 0（`(`）。\n  - 演算法規則：遇運算元直接輸出；遇 `(` 推入；遇 `)` 彈出輸出直到 `(`；遇運算子時若 `priority(token) <= priority(topToken)` 則持續彈出輸出，再將 `token` 推入；輸入結束後清空堆疊。\n  - 追蹤範例（Table 4-1）：`A * B - ( C + D ) + E` → `A B * C D + - E +`。\n- **後序式求值（`postFixEvaluate`，Alg 4-13）**：將**運算元數值**推入堆疊；遇到運算子時依序彈出 `operand2` 與 `operand1`，計算 `operand1 operator operand2` 後推回堆疊（如 `2 4 6 + *` → `2 * (4 + 6) = 20`）。\n\n### 4. 回溯法（Backtracking Steps）\n- **目標搜尋（`seekGoal`，Alg 4-14）**：走訪圖形時將經過節點與所有分支點（Branch Points）推入堆疊，當遇到死路時即可 Pop 退回上一個決策點繼續嘗試。\n- **八皇后問題（`queens8`，Alg 4-15）**：逐列（Row）嘗試放置皇后並將座標 `[row, col]` 推入堆疊；若該列所有欄位皆受威脅（`col >= boardSize`），則從堆疊 Pop 出上一列皇后的位置，嘗試其下一欄（如 Figure 4-17 之 $4 \\times 4$ 棋盤逐步解）。\n\n---\n\n## 四、常見考點／應用場景與限制\n\n- **手算中序轉後序技巧**：先依優先權補齊所有括號 → 將每個運算子移至其對應右括號的右側 → 移除所有括號。\n- **後序求值彈出順序**：第一個彈出的是右運算元 `operand2`，第二個彈出的是左運算元 `operand1`，對於減法 `-` 與除法 `/` 順序至關重要。\n- **溢位／下溢防呆**：動態鏈結串列實作仍需透過 `fullStack` 檢查動態記憶體是否耗盡；陣列實作則需對照 `stackMax` 判斷 Overflow。\n\n---\n\n## 五、關聯頁面\n- **同軌來源出處**：[資料結構 Ch.4 Stacks 課程簡報摘要](#deck/sources/ppt/DS_Ch4-Stacks)\n- **同軌相關概念**：[線性串列與單向鏈結串列演算法](#deck/concepts/ppt/Linear-and-Singly-Linked-Lists)、[進階鏈結串列結構（環狀、雙向、多重鏈結）](#deck/concepts/ppt/Complex-Linked-Lists)", "rawContent": "# 堆疊（Stack）資料結構、ADT 實作與四大應用\n\n> 本頁僅累積來自 **`ppt` 軌道（`raw/ppt/`）** 之知識內容；若需對照另一軌道的說法，請見文末「對應他軌參考」或 `wiki/comparisons/`。\n\n## 一、定義與核心直覺\n\n根據 [[sources/ppt/DS_Ch4-Stacks|資料結構 Ch.4 課程簡報]]，**堆疊（Stack）** 是一種受限的線性串列（Restricted Linear List），所有新增與刪除操作都僅限於同一端——**頂端（Top）**，因此具備 **LIFO（Last In, First Out，後進先出）** 特性。例如依序輸入 `{5, 10, 15, 20}`，取出順序必為 `{20, 15, 10, 5}`。\n\n### 三大基本操作與邊界異常\n- **Push**：將資料放入堆疊頂端；若空間已滿則發生 **Overflow**。\n- **Pop**：移除堆疊頂端資料並回傳給呼叫端；若堆疊為空則發生 **Underflow**。\n- **Stack Top**：複製並回傳頂端資料**但不刪除**（用來偷看即將被 Pop 的元素）；若堆疊為空同樣發生 **Underflow**。\n\n---\n\n## 二、運作機制與詳細說明\n\n### 1. 鏈結串列實作（Stack Linked List Implementation）\n將堆疊設計為抽象資料型別（ADT）可放入函式庫重複呼叫，並透過**資料隱藏（Data Hiding）**避免外部直接存取內部指標。\n- **結構定義**：\n  - `stack` 標頭結構：`count`（`<integer>`）、`top`（`<node pointer>`）。\n  - `node` 資料節點：`data`（`<dataType>`）、`next`（`<node pointer>`）。\n- **八大標準操作（Algorithm 4-1–4-8）**：\n  - `createStack`：初始化 `stack.count = 0`、`stack.top = null`。\n  - `pushStack`：檢查 `stack full`（記憶體配置失敗回傳 `false`），否則配置 `newPtr`，令 `newPtr->next = stack.top`、`stack.top = newPtr`、`stack.count++`。\n  - `popStack`：檢查 `stack empty`（回傳 `false`），否則保存 `dltPtr = stack.top`、`dataOut = stack.top->data`、更新 `stack.top = stack.top->next`、`stack.count--` 並 `recycle(dltPtr)`。\n  - `stackTop`：若非空則回傳 `stack.top->data`。\n  - `emptyStack` / `fullStack` / `stackCount`：封裝狀態檢查，體現資料隱藏原則。\n  - `destroyStack`：迴圈逐一釋放 `stack.top` 所指節點並重設 `stack.count = 0`。\n\n### 2. 陣列實作（Stack ADT - Array Implementation）\n- **適用時機**：若在撰寫程式前即可確定堆疊的**最大容量**，陣列實作比鏈結串列更有效率（省去 `next` 指標空間與動態記憶體配置開銷）。\n- **結構差異（Algorithm 4-16）**：`stack` 結構包含 `stackAry`（指向陣列之指標）、`count`、`stackMax`（最大元素數），且 `top` 改為**陣列索引（`<index>`）**而非指標。\n\n---\n\n## 三、代表性範例、公式或實作重點\n\n簡報將堆疊應用歸納為四大類別：\n\n### 1. 資料反轉（Reversing Data）\n- **數字串列反轉（`reverseNumber`，Alg 4-9）**：依序 Push 輸入整數至 `<EOF>` 或堆疊滿，再逐一 Pop 印出即可得反序結果。\n- **十進位轉二進位（`decimalToBinary`，Alg 4-10）**：不斷取 `number % 2` 並 Push 進堆疊、`number = number / 2`，最後全部 Pop 印出，解決餘數由低位到高位產生導致順序顛倒的問題。\n\n### 2. 語法解析（Parsing Data）\n- **括號配對檢查（`parseParens`，Alg 4-11）**：讀入字元，遇到左括號 `(` 就 Push；遇到右括號 `)` 時若堆疊為空代表「右括號多餘（Closing parenthesis not matched）」，否則 Pop 配對；全部讀完後若堆疊非空代表「左括號未閉合（Opening parenthesis not matched）」。\n\n### 3. 延遲資料使用（Postponing Data Usage）\n- **中序轉後序（`inToPostFix`，Alg 4-12）**：運算式分為前序（Prefix：`+ a b`）、中序（Infix：`a + b`）與後序（Postfix：`a b +`）。後序與前序皆**不需括號**且只有唯一求值規則。\n  - 運算子優先權：Priority 2（`*`, `/`）> Priority 1（`+`, `-`）> Priority 0（`(`）。\n  - 演算法規則：遇運算元直接輸出；遇 `(` 推入；遇 `)` 彈出輸出直到 `(`；遇運算子時若 `priority(token) <= priority(topToken)` 則持續彈出輸出，再將 `token` 推入；輸入結束後清空堆疊。\n  - 追蹤範例（Table 4-1）：`A * B - ( C + D ) + E` → `A B * C D + - E +`。\n- **後序式求值（`postFixEvaluate`，Alg 4-13）**：將**運算元數值**推入堆疊；遇到運算子時依序彈出 `operand2` 與 `operand1`，計算 `operand1 operator operand2` 後推回堆疊（如 `2 4 6 + *` → `2 * (4 + 6) = 20`）。\n\n### 4. 回溯法（Backtracking Steps）\n- **目標搜尋（`seekGoal`，Alg 4-14）**：走訪圖形時將經過節點與所有分支點（Branch Points）推入堆疊，當遇到死路時即可 Pop 退回上一個決策點繼續嘗試。\n- **八皇后問題（`queens8`，Alg 4-15）**：逐列（Row）嘗試放置皇后並將座標 `[row, col]` 推入堆疊；若該列所有欄位皆受威脅（`col >= boardSize`），則從堆疊 Pop 出上一列皇后的位置，嘗試其下一欄（如 Figure 4-17 之 $4 \\times 4$ 棋盤逐步解）。\n\n---\n\n## 四、常見考點／應用場景與限制\n\n- **手算中序轉後序技巧**：先依優先權補齊所有括號 → 將每個運算子移至其對應右括號的右側 → 移除所有括號。\n- **後序求值彈出順序**：第一個彈出的是右運算元 `operand2`，第二個彈出的是左運算元 `operand1`，對於減法 `-` 與除法 `/` 順序至關重要。\n- **溢位／下溢防呆**：動態鏈結串列實作仍需透過 `fullStack` 檢查動態記憶體是否耗盡；陣列實作則需對照 `stackMax` 判斷 Overflow。\n\n---\n\n## 五、關聯頁面\n- **同軌來源出處**：[[sources/ppt/DS_Ch4-Stacks]]\n- **同軌相關概念**：[[concepts/ppt/Linear-and-Singly-Linked-Lists]]、[[concepts/ppt/Complex-Linked-Lists]]", "slides": [{"index": 0, "kind": "cover", "title": "堆疊（Stack）資料結構、ADT 實作與四大應用", "markdown": ""}, {"index": 1, "kind": "content", "title": "投影片 2", "markdown": "> 本頁僅累積來自 **`ppt` 軌道（`raw/ppt/`）** 之知識內容；若需對照另一軌道的說法，請見文末「
